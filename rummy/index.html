// --- playing or watching ------------------------------------------------------------
//
// Only one tab plays a seat of a game. It holds a lock (Web Locks) for as long as
// the game is open, and any other tab on that seat only watches: nothing it shows
// can be moved, it computes nothing and keeps nothing, and follows the other tab
// through the browser's storage. Play only moves when you press Play here, never
// by itself: a tab being reloaded lets go of its lock for a moment, and shouldn't
// come back to find the game gone. Without locks (they need https or localhost),
// tabs just follow each other.
function claimPlay(id, {wait = false, steal = false} = {}) {
  if (!LOCKS) return;
  const name = `${STORE}play.${id}.${mySeat}`;
  let release, released = false;
  const held = new Promise(resolve => { release = () => { released = true; resolve(); }; });
  ui.releaseLock = release;
  const open = () => !released && gameId === id;
  let done;
  const settled = new Promise(resolve => { done = resolve; });
  if (wait) {
    ui.lockPending = settled;
    settled.then(() => {
      if (ui.lockPending === settled) ui.lockPending = null;
      if (open() && record) { render(); followUp(); }
    });
  }
  const ask = (again) => LOCKS.request(name, steal ? {steal: true} : {ifAvailable: true}, lock => {
    if (!lock) {
      // A tab reloading may only just be letting go of its own lock: ask once more.
      if (again) { setTimeout(() => ask(false).catch(lost), 150); return; }
      if (open()) setObserving(true);
      done();
      return;
    }
    if (open()) {
      setObserving(false);
      if (game) claimComputing(id);
    }
    done();
    return held;
  });
  const lost = e => {
    // Another tab pressed Play here.
    if (e?.name !== "AbortError") console.warn(e);
    if (open()) setObserving(true);
    done();
  };
  ask(!steal).catch(lost);
}

function setObserving(on) {
  if (ui.observing === on) return;
  ui.observing = on;
  if (!game) return;
  if (on) {                     // anything this tab was still doing stops here
    for (const timer of timers) clearTimeout(timer);
    timers.clear();
    brain.turn++;
    stopClock();
    stopComputing();
    ui.selected.clear();
    view.table = null;
    syncRack();
  } else {
    ui.thought = -1;
    if (myTurn()) {
      view.table = copyTable(game.table);
      syncRack();
      startClock();
    }
    saveGame();
  }
  render();
  if (!on) followUp();
}

// With no game open: says why, and offers a new one or the list.
function showNoGame(key) {
  const buttons = [{label: t("newGame"), default: true, cancel: true, action: newGame}];
  if (listGames().length) buttons.push({label: t("games").replace("...", ""), action: showGames});
  dialog("Tile Rummy", `<p>${t(key)}</p>`, buttons);
}
// --- who computes -------------------------------------------------------------------
//
// With one person, their tab. With several, one tab computes for the computer players:
// every tab that plays asks for a lock, the first gets it, and when that tab goes the
// next one has it by itself. Without locks, the lowest seat of a person computes.
function computesHere() {
  if (ui.observing || ui.lockPending || record.started === false) return false;
  if (!severalPeople()) return true;
  // Online there are no shared locks: the lowest seat of a person who has the room open
  // computes. If two ever do at once, the turn counter lets only one count.
  if (room.online) return Boolean(room.present?.length) && Math.min(...room.present) === mySeat;
  if (!LOCKS) return game.players.findIndex(p => p.human) === mySeat;
  return ui.computes;
}
function claimComputing(id) {
  if (!LOCKS || !severalPeople() || ui.releaseComputing) return;
  const asking = new AbortController();
  let release = () => {};
  const held = new Promise(resolve => { release = resolve; });
  ui.releaseComputing = () => { asking.abort(); release(); ui.computes = false; ui.releaseComputing = null; };
  LOCKS.request(`${STORE}compute.${id}`, {signal: asking.signal}, () => {
    if (gameId !== id || asking.signal.aborted) return;
    ui.computes = true;
    followUp();
    return held;
  }).catch(e => { if (e?.name !== "AbortError") console.warn(e); });
}
function stopComputing() {
  ui.releaseComputing?.();
}

// An address with an id this browser doesn't have.
const showUnknownGame = () => showNoGame("gameUnknown");

// Stops the game that is open and deletes everything kept of it, after asking.
function askStopGame() {
  if (!game) return;
  dialog(t("stopGame"), `<p>${t("stopGameAsk")}</p>`, [
    {label: t("no"), default: true, cancel: true},
    {label: t("stopGameYes"), action: () => {
      const id = gameId;
      leaveGame();
      deleteGame(id);
      try {
        if (JSON.parse(localStorage.getItem(LAST_KEY))?.id === id) localStorage.removeItem(LAST_KEY);
      } catch {}
      showNoGame("gameStopped");
    }},
  ]);
}
// No game open any more, and none in the address.
function leaveGame() {
  closeGame();
  gameId = null;
  const url = new URL(location.href);
  url.searchParams.delete("game");
  url.searchParams.delete("seat");
  history.replaceState(null, "", url);
}

function openMenu() {
  ui.menu = true;
  $("#menu").hidden = false;
  $("#menu-button").setAttribute("aria-expanded", "true");
  $("#menu button").focus();
}
function closeMenu() {
  ui.menu = false;
  $("#menu").hidden = true;
  $("#menu-button").setAttribute("aria-expanded", "false");
}
$("#menu-button").addEventListener("click", e => { e.stopPropagation(); ui.menu ? closeMenu() : openMenu(); });
// The arrow keys go through the menu, as in any menu.
$("#menu").addEventListener("keydown", e => {
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  e.preventDefault();
  e.stopPropagation();
  const items = [...$("#menu").querySelectorAll("button")];
  items[(items.indexOf(document.activeElement) + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length].focus();
});
addEventListener("click", e => { if (ui.menu && !e.target.closest(".menu")) closeMenu(); });
for (const item of document.querySelectorAll(".menu [data-act]")) {
  item.addEventListener("click", () => {
    closeMenu();
    const act = item.dataset.act;
    if (act === "new") newGame();
    else if (act === "stop") askStopGame();
    else if (act === "games") showGames();
    else if (act === "twoTabs") askTwoTabs();
    else if (act === "online") askOnline();
    else if (act === "invite") copyGameLink();
    else if (act === "opp") { const n = Number(item.dataset.n); if (n !== game?.players.length - 1) setOpponents(n); }
    else if (act === "scores") showScores(null);
    else if (act === "options") showOptions();
    else if (act === "rules") dialog(t("rules"), t("rulesHtml"), [{label: t("ok"), default: true}], true);
    else if (act === "about") dialog(t("about"), `${t("aboutText")}<p>${t("solver" + brain.solver)}</p>`, [{label: t("ok"), default: true}]);
  });
}

addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (onEscape) onEscape(); else if (ui.menu) { closeMenu(); $("#menu-button").focus(); }
    else if (myTurn() && ui.selected.size) { ui.selected.clear(); render(); }
    return;
  }
  if (e.key === "F2") { e.preventDefault(); newGame(); return; }
  if (e.key === "F1") { e.preventDefault(); dialog(t("rules"), t("rulesHtml"), [{label: t("ok"), default: true}], true); return; }
  if (onEscape || e.target.closest("input, button")) return;
  if (e.key === "Enter") finishTurn();
});

$("#go").addEventListener("click", finishTurn);
$("#play-here").addEventListener("click", () => claimPlay(gameId, {steal: true}));
$("#reset").addEventListener("click", () => { if (canAct()) { undoTurn(); saveGame(); render(); } });
$("#sort-num").addEventListener("click", () => sortRack(false));
$("#sort-color").addEventListener("click", () => sortRack(true));

// --- playing online ----------------------------------------------------------------
//
// Through the multiplayer layer (../multiplayer/client.js): on a multiplayer server if one
// serves this page, or else on our Worker. The state, turns, referee and computer players are
// the same as in any other game: only the room is another one. Without the layer, such as
// offline, none of this is offered.

// Where to look for a multiplayer server: next to the page, or in tests one given as &base=.
const LAYER_BASE = TEST && params.get("base") || "..";
let layer = null, connection = null, serverThere = false;
const loadLayer = async () => { layer ??= await import("../multiplayer/client.js"); return layer; };
async function connectToLayer() {
  const {connect} = await loadLayer();
  connection ??= await connect({
    game: "rummy",
    scramble: true,
    base: LAYER_BASE,
    realProject: !TEST,
    sessionName: TEST && params.get("session") ? `multiplayer.test.${params.get("session")}` : undefined,
    page: location.origin + location.pathname + (TEST ? "?test" : ""),
  });
  return connection;
}
async function lookForServer() {
  try {
    serverThere = await (await loadLayer()).available(LAYER_BASE, {realProject: !TEST});
  } catch {
    serverThere = false;                // no layer here, such as offline
  }
  showMenuItems();
}
function showMenuItems() {
  const online = Boolean(room?.online);
  $('[data-act="online"]').hidden = !serverThere;
  const invite = $('[data-act="invite"]');
  invite.hidden = !online;
  // With several links there's a choice to make, so it asks which.
  const span = invite.querySelector("span");
  span.dataset.t = Object.keys(invitesOfThisRoom() ?? {}).length > 1 ? "showInvite" : "copyGameLink";
  span.textContent = t(span.dataset.t);
  $('[data-act="stop"]').hidden = online;      // it would only stop it for you
}

// The online games this browser is in, to go back to them. Only a note of each: the game is on the server.
function onlineGames() {
  if (!KEEP) return [];
  const found = [];
  try {
    for (const key of Object.keys(localStorage)) {
      if (!key.startsWith(ROOM_PREFIX)) continue;
      const note = JSON.parse(localStorage.getItem(key));
      found.push({id: key.slice(ROOM_PREFIX.length), updated: note.updated ?? 0, players: note.players ?? 2});
    }
  } catch {}
  return found.sort((a, b) => b.updated - a.updated);
}
function noteOnlineGame() {
  if (!KEEP || !room?.online) return;
  try { localStorage.setItem(ROOM_PREFIX + gameId, JSON.stringify({updated: Date.now(), players: room.seatCount})); } catch {}
}
function forgetOnlineGame(id) {
  try {
    localStorage.removeItem(ROOM_PREFIX + id);
    localStorage.removeItem(INVITES_PREFIX + id);
    for (let seat = 0; seat < 4; seat++) localStorage.removeItem(`${VIEW_PREFIX}${id}.${seat}`);
    if (JSON.parse(localStorage.getItem(LAST_KEY))?.room === id) localStorage.removeItem(LAST_KEY);
  } catch {}
}

function askOnline() {
  const form = document.createElement("form");
  const select = i => `<label class="field"><span>${t("playerN", i + 2)}</span> <select name="seat${i}">
      <option value="person"${i === 0 ? " selected" : ""}>${t("seatPerson")}</option>
      <option value="computer">${t("seatComputer")}</option>
      <option value="none"${i === 0 ? "" : " selected"}>${t("seatNone")}</option></select></label>`;
  form.innerHTML = `<p>${t("onlineNote")}</p><label class="field"><span>${t("yourName")}</span> <input name="name" maxlength="40" autocomplete="off"></label>
    ${[0, 1, 2].map(select).join("")}<p class="note"></p>`;
  const input = form.querySelector("input");
  try { input.value = localStorage.getItem(STORE + "name") ?? ""; } catch {}
  form.addEventListener("submit", e => e.preventDefault());
  dialog(t("playOnline").replace("...", ""), form, [
    {label: t("onlineCreate"), default: true, action: () => {
      const data = new FormData(form), others = [0, 1, 2].map(i => data.get(`seat${i}`));
      createOnline(input.value.trim() || t("playerN", 1), others.filter(kind => kind !== "none"));
    }},
    {label: t("cancel"), cancel: true},
  ]);
  input.focus();
}

async function createOnline(name, others, retried = false) {
  if (!others.includes("person")) { message(t("onlineNeedsPerson")); return; }
  if (KEEP) try { localStorage.setItem(STORE + "name", name); } catch {}
  try {
    const mp = await connectToLayer();
    let computers = 0;
    const players = [{human: true, name}, ...others.map(kind => kind === "person" ? {human: true} : {human: false, name: NAMES[computers++]})];
    const state = dealGame(players, random).game;
    const seats = players.map(p => p.human ? {kind: "person", ...(p.name ? {name: p.name} : {})} : {kind: "computer", name: p.name, level: settings.level});
    const newRoom = await mp.create({seats, state, current: whoWrites(state)});
    if (KEEP) try { localStorage.setItem(INVITES_PREFIX + newRoom.id, JSON.stringify(newRoom.inviteLinks)); } catch {}
    enterRoom(newRoom, {push: true});
    showInvites();
  } catch (e) {
    console.warn(e);
    if (e.code === "secret-needed" && !retried) askSecret(() => createOnline(name, others, true));
    else message(t(e.code === "too-many-rooms" ? "tooManyRooms" : "onlineFailed"));
  }
}

// A server with a secret only lets those who know it create games: asks once, and tries again.
async function askSecret(retry) {
  const form = document.createElement("form");
  form.innerHTML = `<p>${t("secretNote")}</p><label class="field"><span>${t("secretLabel")}</span> <input name="secret" type="password" autocomplete="off"></label>`;
  form.addEventListener("submit", e => e.preventDefault());
  const input = form.querySelector("input");
  dialog(t("secretTitle"), form, [
    {label: t("ok"), default: true, action: async () => {
      try {
        await (await connectToLayer()).signIn({secret: input.value});
        retry();
      } catch (e) {
        console.warn(e);
        message(t(e.code === "too-many-attempts" ? "secretTooMany" : e.code === "wrong-secret" ? "secretWrong" : "onlineFailed"));
      }
    }},
    {label: t("cancel"), cancel: true},
  ]);
  input.focus();
}

function invitesOfThisRoom() {
  if (!room?.online) return null;
  if (Object.keys(room.inviteLinks ?? {}).length) return room.inviteLinks;
  try { return JSON.parse(localStorage.getItem(INVITES_PREFIX + gameId)); } catch { return null; }
}
// The link to send again: the invitation if this browser made it, or else the room's address.
async function copyGameLink() {
  const entries = Object.entries(invitesOfThisRoom() ?? {});
  if (entries.length > 1) { showInvites(); return; }
  const [seat, invitation] = entries[0] ?? [];
  const address = new URL(location.href);
  address.hash = "";
  const link = invitation ?? address.href;
  try {
    await navigator.clipboard.writeText(link);
    message(t(invitation && !record?.seats[seat]?.uid ? "linkCopied" : "linkCopiedJoined"));
  } catch {
    // No clipboard here, such as on a plain address on the home network.
    const box = document.createElement("div");
    box.innerHTML = `<p>${t("linkNotCopied")}</p><input class="link" readonly>`;
    const input = box.querySelector("input");
    input.value = link;
    dialog(t("linkToCopy"), box, [{label: t("close"), default: true, cancel: true}]);
    input.select();
  }
}
function showInvites() {
  const links = invitesOfThisRoom();
  if (!links) return;
  const box = document.createElement("div");
  const note = document.createElement("p");
  const joined = seat => record?.seats[seat]?.uid;
  note.textContent = Object.keys(links).some(joined) ? `${t("inviteNote")} ${t("inviteJoinedNote")}` : t("inviteNote");
  box.append(note);
  for (const [seat, link] of Object.entries(links)) {
    const label = document.createElement("label");
    label.className = "invite-row";
    const title = document.createElement("span");
    title.textContent = joined(seat) && record.seats[seat].name ? record.seats[seat].name : t("playerN", Number(seat) + 1);
    const input = document.createElement("input");
    input.className = "link";
    input.readOnly = true;
    input.value = link;
    const copy = document.createElement("button");
    copy.type = "button";
    copy.className = "btn small";
    copy.textContent = navigator.share ? t("shareLink") : t("copyLink");
    copy.addEventListener("click", () => {
      if (navigator.share) navigator.share({url: link}).catch(() => {});
      else navigator.clipboard?.writeText(link).catch(() => {});
      input.select();
    });
    label.append(title, input, copy);
    box.append(label);
  }
  dialog(t("showInvite").replace("...", ""), box, [{label: t("close"), default: true}], true);
}

// Enters a room of the multiplayer server: from here on it is a game like any other.
function enterRoom(newRoom, {push = false} = {}) {
  closeGame();
  gameId = newRoom.id;
  room = newRoom;
  mySeat = newRoom.mySeat;
  ui.offline = false;
  claimPlay(gameId, {wait: true});
  const url = new URL(location.href);
  url.searchParams.set("room", gameId);
  url.searchParams.delete("game");
  url.searchParams.delete("seat");
  url.hash = "";
  history[push ? "pushState" : "replaceState"](null, "", url);
  const savedView = readView(gameId, mySeat);
  let first = true;
  stopWatching = room.watch(news => {
    room.seatCount = news.seats.length;
    if (first) noteOnlineGame();
    receive(news, first ? savedView : undefined);
    first = false;
  });
  room.onConnection = connected => { ui.offline = !connected; if (game) render(); };
  room.onPresence = () => { if (game) { render(); followUp(); } };
}

// An address with a room in it: join with the key after the #, or go back to a room you are in.
async function openOnline(id, push = false) {
  const fallBack = key => {
    forgetOnlineGame(id);
    const url = new URL(location.href);
    url.searchParams.delete("room");
    url.hash = "";
    history.replaceState(null, "", url);
    if (game) closeGame();
    gameId = null;
    room = null;
    newGame();
    message(t(key));
  };
  try {
    const client = await loadLayer();
    const mp = await connectToLayer();
    const invite = client.parseInvite(location.href);
    if (!invite || invite.room !== id) { enterRoom(await mp.open(id), {push}); return; }
    const preview = await mp.preview(location.href);
    if (preview.joined) {
      enterRoom(await mp.open(id));
      // A session belongs to a browser: this is someone else's invitation, opened by a player.
      if (preview.seat !== invite.seat) message(t("inviteIsYours"));
      return;
    }
    const form = document.createElement("form");
    const host = preview.seats.find(seat => seat.taken)?.name ?? t("opponent");
    form.innerHTML = `<p></p><label class="field"><span>${t("yourName")}</span> <input name="name" maxlength="40" autocomplete="off"></label>`;
    form.querySelector("p").textContent = t("joinNote", host, preview.seats.length);
    const input = form.querySelector("input");
    try { input.value = localStorage.getItem(STORE + "name") ?? ""; } catch {}
    form.addEventListener("submit", e => e.preventDefault());
    dialog("Tile Rummy", form, [
      {label: t("onlineJoin"), default: true, action: async () => {
        const name = input.value.trim() || t("opponent");
        if (KEEP) try { localStorage.setItem(STORE + "name", name); } catch {}
        try {
          enterRoom(await mp.join(location.href, {name}));
        } catch (e) {
          console.warn(e);
          fallBack(e.code === "seat-taken" ? "seatTaken" : "inviteNotValid");
        }
      }},
      {label: t("cancel"), cancel: true, action: () => fallBack("inviteDeclined")},
    ]);
    input.focus();
  } catch (e) {
    console.warn(e);
    fallBack(e.code === "no-such-room" ? "roomGone" : e.code === "not-a-member" || e.code === "secret-needed" ? "notInRoom"
      : e.code === "seat-taken" ? "seatTaken" : e.code === "wrong-key" ? "inviteNotValid" : "onlineFailed");
  }
}

// While someone else plays, the tab's title says when it is your turn.
function setTitle(hidden = document.hidden) {
  document.title = room?.online && myTurn() && hidden ? `● ${t("yourTurnShort")} · Tile Rummy` : "Tile Rummy";
}
addEventListener("visibilitychange", () => setTitle());

// --- language --------------------------------------------------------------------

function setLanguage(name) {
  lang = name;
  if (!TEST) try { localStorage.setItem("solfege.lang", name); } catch {}
  document.documentElement.lang = name;
  for (const el of document.querySelectorAll("[data-t]")) el.textContent = t(el.dataset.t);
  for (const b of document.querySelectorAll("[data-lang]")) b.setAttribute("aria-pressed", b.dataset.lang === name);
  if (game) render();
}
for (const b of document.querySelectorAll("[data-lang]")) b.addEventListener("click", () => setLanguage(b.dataset.lang));

// For the tests: makes this state the game's, as if it had come from a turn.
function testPosition(state) {
  const news = room.adopt({...record, state, current: whoWrites(state), turn: record.turn + 1, restarted: true});
  saveRecord(news);
  receive(news);
}

// Another tab changed this game, as another player or the same one: follow it.
addEventListener("storage", e => {
  if (!gameId || e.key !== GAME_PREFIX + gameId) return;
  if (e.newValue === null) {               // stopped or deleted in another tab
    leaveGame();
    showNoGame("gameStoppedElsewhere");
    return;
  }
  // Not readGame, which turns down a game that doesn't add up: here the referee
  // should see it, and say so.
  let news = null;
  try { news = JSON.parse(localStorage.getItem(GAME_PREFIX + gameId))?.record; } catch {}
  if (Number.isInteger(news?.turn) && (!record || news.turn >= record.turn)) receive(room.adopt(news));
});

// The back and forward buttons go between games.
addEventListener("popstate", () => {
  const address = new URLSearchParams(location.search), id = address.get("game"), seat = seatFromAddress(address);
  if (address.get("room")) { if (address.get("room") !== gameId) openOnline(address.get("room")); return; }
  if ((id !== gameId || seat !== mySeat) && !openKeptGame(id, {seat})) {
    closeGame();
    gameId = null;
    showUnknownGame();
  }
});

setLanguage(lang);
forgetOldGames();
forgetLeftovers();
{
  // An id in the address is that game. Without one: the game played last, unless the
  // address asks for another number of opponents. Otherwise, a new game.
  const wanted = params.get("game"), wantedRoom = params.get("room");
  let last = null;
  try { last = KEEP ? JSON.parse(localStorage.getItem(LAST_KEY)) : null; } catch {}
  const opponents = params.has("opponents") ? settings.opponents : null;
  const lastFits = () => opponents === null || readGame(last.id)?.record.state.players.length === opponents + 1;
  if (wantedRoom) {
    openOnline(wantedRoom);
  } else if (last?.room && opponents === null) {
    openOnline(last.room);
  } else if (wanted) {
    if (!openKeptGame(wanted, {seat: mySeat})) showUnknownGame();
  } else if (!(last?.id && lastFits() && openKeptGame(last.id, {seat: last.seat ?? 0}))) {
    newGame();
  }
}

tidyGames();
if (location.protocol.startsWith("http")) lookForServer();

if (!TEST && "serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(e => console.warn(e));
}
</script>
