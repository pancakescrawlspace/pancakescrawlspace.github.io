<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tile Rummy</title>
<!-- Installing it as an app, and the icons; sw.js keeps it for offline use. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161614" media="(prefers-color-scheme: dark)">
<style>
  /* Plain and flat, in the colours of the other pages, around a green table.
     The table and the tiles look the same in light and dark mode. The layout is
     a card table: the opponents along the left, top and right, and you at the bottom. */
  :root {
    --bg: #f7f6f2;            /* the same plain colours as the solfège and piano pages */
    --panel: #ffffff;
    --text: #1d1c1a;
    --muted: #6d6a63;
    --line: #dedbd3;
    --accent: #2f5fb3;
    --accent-soft: #e3ebf9;
    --accent-text: #ffffff;
    --yes: #23753a;
    --no: #b3372f;
    --no-soft: #f8e0dd;
    --table: #007a1f;
    --on-table: #ffffff;
    --on-table-soft: rgba(255, 255, 255, .82);
    --tile: #fdfdfb;
    --tile-line: #b9b5ab;
    --tile-back: #e6e3da;
    --tile-mine: #dde9fb;
    --ink0: #1c1c1c;          /* the four tile colours */
    --ink1: #c8141e;
    --ink2: #1646b8;
    --ink3: #e27500;
    --t: clamp(22px, min(3.2vw, 5.2vh), 42px);   /* width of a tile in your rack */
    --tt: calc(var(--t) * .84);                   /* on the table */
    --to: calc(var(--t) * .62);                   /* in an opponent's hand */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614;
      --panel: #201f1d;
      --text: #ebe9e4;
      --muted: #9a968d;
      --line: #36342f;
      --accent: #7aa2ec;
      --accent-soft: #233150;
      --accent-text: #10131a;
      --yes: #6fcf87;
      --no: #f08a80;
      --no-soft: #43231f;
    }
  }
  @media (max-width: 640px) {
    :root { --t: clamp(22px, 7.4vw, 32px); }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* --- the page around the game --- */
  .app { position: relative; display: flex; flex-direction: column; margin: auto; }
  /* No bar: two small patches in the page's colour, on the corners of the table. */
  .topbar { position: absolute; z-index: 20; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; padding: 4px; pointer-events: none; user-select: none; }
  .topbar > button, .topbar > .lang, .topbar > .menu { pointer-events: auto; }
  #menu-button { display: grid; place-items: center; flex: none; width: 34px; height: 30px; padding: 0; border: none; border-radius: 6px; background: var(--bg); cursor: pointer; }
  #menu-button svg { width: 18px; height: 18px; }
  #menu-button:hover, #menu-button[aria-expanded=true] { background: var(--accent-soft); }
  #menu-button:focus-visible { outline: 2px solid var(--accent); }
  .topbar .lang { display: flex; flex: none; align-items: center; gap: 2px; height: 30px; padding: 0 3px; border-radius: 6px; background: var(--bg); }
  .topbar .lang button { padding: 2px 6px; border: none; border-radius: 6px; background: none; color: var(--muted); cursor: pointer; }
  .topbar .lang button[aria-pressed=true] { background: var(--accent-soft); color: var(--text); }
  .menu {
    position: absolute;
    z-index: 30;
    top: 100%;
    left: 4px;
    min-width: 190px;
    padding: 4px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
  }
  .menu button {
    position: relative;
    display: flex;
    justify-content: space-between;
    gap: 28px;
    width: 100%;
    padding: 4px 18px 4px 20px;
    border: none;
    border-radius: 5px;
    background: none;
    text-align: left;
    cursor: pointer;
  }
  .menu button:hover, .menu button:focus-visible { background: var(--accent-soft); outline: none; }
  .menu button[aria-checked=true]::before { content: "•"; position: absolute; left: 8px; font-weight: bold; }
  .menu hr { margin: 4px 2px; border: none; border-top: 1px solid var(--line); }

  .btn {
    min-width: 92px;
    padding: 5px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover:not(:disabled) { border-color: var(--muted); }
  .btn.default { border-color: var(--accent); background: var(--accent); color: var(--accent-text); font-weight: 600; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn:disabled { color: var(--muted); background: var(--bg); border-color: var(--line); font-weight: 400; cursor: default; }

  .statusbar { display: flex; gap: 12px; padding: 5px 8px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .statusbar > div { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status { flex: 1; }
  #status.warn { color: var(--no); }
  .app { width: min(1200px, 100vw); height: min(880px, 100dvh); }

  /* --- the table: opponents left, top and right, you at the bottom --- */
  .tabletop {
    position: relative;
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-rows: auto minmax(0, 1fr) auto;
    padding: 2px;
    background: var(--table);
    color: var(--on-table);
  }
  .seat { display: flex; align-items: center; gap: 4px; min-width: 0; min-height: 0; padding: 6px; }
  #seat-top { grid-area: 1 / 2 / 2 / 3; flex-direction: column; }
  /* The players on the sides start below the patches. A lone opponent at the top keeps clear of them too. */
  #seat-left { grid-area: 1 / 1 / 3 / 2; flex-direction: column; padding-top: 40px; }
  #seat-right { grid-area: 1 / 3 / 3 / 4; flex-direction: column; padding-top: 40px; }
  #seat-left[hidden] ~ #seat-top { padding-inline: 84px; }
  #seat-bottom { grid-area: 3 / 1 / 4 / 4; flex-wrap: wrap; align-items: flex-end; justify-content: center; gap: 6px 14px; padding: 4px 8px 8px; }
  .who { display: flex; flex-direction: column; align-items: center; text-align: center; max-width: 9em; }
  .who .name { padding: 0 6px; border-radius: 6px; font-weight: 600; }
  .seat.active .who .name { background: var(--accent); color: var(--accent-text); }
  .who .count { font-size: 12px; color: var(--on-table-soft); }
  .said { min-height: 1.35em; font-size: 12px; color: var(--on-table-soft); text-align: center; max-width: 11em; }
  #seat-top .said { max-width: none; }
  .hand { position: relative; --w: var(--to); }
  .hand.h { width: 100%; height: calc(var(--to) * 1.36); }
  .hand.v { flex: 1; width: calc(var(--to) * 1.36 + 4px); min-height: 40px; }
  .hand > .tile { position: absolute; }
  .hand.v > .tile { transform: rotate(90deg); }

  #table {
    grid-area: 2 / 2 / 3 / 3;
    --w: var(--tt);
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    justify-content: center;
    gap: 10px 14px;
    min-height: 0;
    padding: 10px 6px;
    overflow: auto;
  }
  .set {
    display: flex;
    gap: 2px;
    padding: 4px;
    border: 1px solid transparent;
    border-radius: 6px;
    background: rgba(0, 0, 0, .16);
  }
  .set.bad { border-color: #ff6a5c; background: rgba(150, 0, 0, .45); }
  .set.locked { opacity: .82; }
  .newset {
    display: grid;
    place-items: center;
    min-width: calc(var(--tt) * 3.4);
    min-height: calc(var(--tt) * 1.36 + 10px);
    padding: 0 8px;
    border: 1px dashed var(--on-table-soft);
    border-radius: 6px;
    color: var(--on-table-soft);
    font-size: 12px;
  }
  .set.over, .newset.over, #rack.over { outline: 2px dashed var(--on-table); outline-offset: 2px; }
  .empty-table { align-self: center; margin: auto; color: var(--on-table-soft); text-align: center; }

  .mine { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; flex: 0 1 auto; }
  .mine .who { flex-direction: row; gap: 8px; max-width: none; }
  #rack {
    --w: var(--t);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-content: flex-start;
    gap: 3px;
    width: min(100%, calc((var(--t) + 3px) * 15 + 14px));
    max-height: calc((var(--t) * 1.36 + 3px) * 3 + 14px);
    min-height: calc(var(--t) * 1.36 + 14px);
    padding: 6px;
    overflow-y: auto;
    border-radius: 6px;
    background: rgba(0, 0, 0, .2);
  }
  /* The buttons are on the table but keep the page's colours, for their own text too. */
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; color: var(--text); }
  .controls .wide { grid-column: span 2; }
  @media (max-width: 640px) {
    .controls { grid-template-columns: repeat(4, auto); }
    .controls .wide { grid-column: auto; }
    .controls .btn { min-width: 0; padding: 4px 6px; font-size: 13px; line-height: 1.15; white-space: normal; }
    .seat { padding: 4px 3px; }
    #seat-left, #seat-right { padding-top: 40px; }
    #table { gap: 8px 10px; padding: 8px 4px; }
  }

  /* --- tiles --- */
  .tile {
    --ink: var(--ink0);
    position: relative;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    width: var(--w);
    height: calc(var(--w) * 1.36);
    border-radius: calc(var(--w) * .14);
    background: var(--tile);
    box-shadow: inset 0 0 0 1px var(--tile-line);
    color: var(--ink);
    font: 700 calc(var(--w) * .56)/1 system-ui, -apple-system, "Segoe UI", sans-serif;
    letter-spacing: -.04em;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  .tile.k1 { --ink: var(--ink1); }
  .tile.k2 { --ink: var(--ink2); }
  .tile.k3 { --ink: var(--ink3); }
  .tile svg { width: 74%; height: auto; }
  .tile .rep { position: absolute; right: 7%; bottom: 4%; font-size: 36%; opacity: .75; }
  .tile.back { background: var(--tile-back); }
  .tile.mine { background: var(--tile-mine); }
  .tile.recent { box-shadow: 0 0 0 2px #ffd400; }
  .tile.new { box-shadow: 0 0 0 2px #8cf58c; }
  .tile.sel { transform: translateY(-5px); box-shadow: 0 0 0 2px #ffffff; }
  .tile.can { cursor: grab; }
  .tile.dragging { opacity: .25; }
  .ghost { position: fixed; z-index: 50; display: flex; gap: 2px; pointer-events: none; --w: var(--t); }
  .ghost .tile { box-shadow: inset 0 0 0 1px var(--tile-line), 0 3px 8px rgba(0, 0, 0, .3); transform: none; }

  /* --- dialogs --- */
  .layer { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 12px; }
  .dialog {
    display: flex;
    flex-direction: column;
    width: min(460px, 100%);
    max-height: calc(100dvh - 24px);
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
    box-shadow: 0 6px 24px rgba(0, 0, 0, .18);
  }
  .dialog.wide { width: min(620px, 100%); }
  .dialog .head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 0; font-weight: 600; }
  .dialog .caption { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .dialog .close { padding: 0 6px; border: none; border-radius: 6px; background: none; color: var(--muted); cursor: pointer; }
  .dialog .close:hover { background: var(--accent-soft); }
  .dialog .body { padding: 10px 12px 4px; overflow: auto; }
  .dialog .body p { margin: 0 0 10px; }
  .dialog .body h3 { margin: 12px 0 4px; font-size: 1em; }
  .dialog .body ul { margin: 0 0 8px; padding-left: 18px; }
  .dialog .buttons { display: flex; justify-content: flex-end; gap: 6px; padding: 8px 12px 12px; }
  fieldset { margin: 0 0 10px; padding: 6px 10px 8px; border: 1px solid var(--line); border-radius: 8px; }
  legend { padding: 0 4px; color: var(--muted); }
  fieldset label { display: flex; gap: 6px; align-items: center; padding: 2px 0; }
  fieldset .note { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
  .sheet { width: 100%; border-collapse: collapse; }
  .sheet th, .sheet td { padding: 3px 8px; text-align: right; white-space: nowrap; }
  .sheet th:first-child, .sheet td:first-child { text-align: left; }
  .sheet thead th { border-bottom: 1px solid var(--line); }
  .sheet tfoot td { border-top: 1px solid var(--line); font-weight: 600; }
  .sheet .win { color: var(--yes); }
  .sheet .neg { color: var(--no); }
  .result { margin-bottom: 10px; font-weight: 600; }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <button type="button" id="menu-button" aria-label="Menu" title="Menu" aria-haspopup="menu" aria-expanded="false" aria-controls="menu">
      <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M2 4.5h14M2 9h14M2 13.5h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <span class="lang" role="group" aria-label="Taal / Language">
      <button type="button" data-lang="nl" lang="nl" title="Nederlands">NL</button>
      <button type="button" data-lang="en" lang="en" title="English">EN</button>
    </span>
    <div class="menu" id="menu" role="menu" aria-label="Menu" hidden>
      <button type="button" role="menuitem" data-act="new"><span data-t="newGame"></span><span>F2</span></button>
      <hr>
      <button type="button" role="menuitemradio" data-act="opp" data-n="1"><span data-t="opp1"></span></button>
      <button type="button" role="menuitemradio" data-act="opp" data-n="2"><span data-t="opp2"></span></button>
      <button type="button" role="menuitemradio" data-act="opp" data-n="3"><span data-t="opp3"></span></button>
      <hr>
      <button type="button" role="menuitem" data-act="scores"><span data-t="scores"></span></button>
      <button type="button" role="menuitem" data-act="options"><span data-t="options"></span></button>
      <hr>
      <button type="button" role="menuitem" data-act="rules"><span data-t="rules"></span><span>F1</span></button>
      <button type="button" role="menuitem" data-act="about"><span data-t="about"></span></button>
    </div>
  </header>
  <div class="tabletop" id="tabletop">
    <div class="seat" id="seat-left" hidden><div class="who"><span class="name"></span><span class="count"></span></div><div class="hand v"></div><div class="said"></div></div>
    <div class="seat" id="seat-top" hidden><div class="hand h"></div><div class="who"><span class="name"></span><span class="count"></span></div><div class="said"></div></div>
    <div class="seat" id="seat-right" hidden><div class="who"><span class="name"></span><span class="count"></span></div><div class="hand v"></div><div class="said"></div></div>
    <div id="table"></div>
    <div class="seat" id="seat-bottom">
      <div class="mine">
        <div class="who"><span class="name"></span><span class="said"></span></div>
        <div id="rack"></div>
      </div>
      <div class="controls">
        <button type="button" class="btn default wide" id="go"></button>
        <button type="button" class="btn wide" id="reset" data-t="reset"></button>
        <button type="button" class="btn" id="sort-num" data-t="sortNum"></button>
        <button type="button" class="btn" id="sort-color" data-t="sortColor"></button>
      </div>
    </div>
  </div>
  <div class="statusbar">
    <div id="status"></div>
    <div id="pool"></div>
    <div id="clock" hidden></div>
  </div>
</div>
<div class="layer" id="layer" hidden></div>

<script src="rules.js"></script>
<script>
"use strict";

// The rules and the computer players are in rules.js.

const $ = sel => document.querySelector(sel);
const params = new URLSearchParams(location.search);
// ?test is for test/index.html: no waiting between turns, and nothing kept
// between visits. ?seed=1 deals the same tiles every time.
const TEST = params.has("test");
let random = Math.random;
if (params.has("seed")) {
  let s = Number(params.get("seed")) >>> 0;
  random = () => {                       // mulberry32
    s = (s + 0x6D2B79F5) >>> 0;
    let x = Math.imul(s ^ s >>> 15, s | 1);
    x ^= x + Math.imul(x ^ x >>> 7, x | 61);
    return ((x ^ x >>> 14) >>> 0) / 4294967296;
  };
}
const NAMES = ["Anna", "Bas", "Carmen"];
const SEATS = {1: ["top"], 2: ["left", "right"], 3: ["left", "top", "right"]};
const THINK = 750, PAUSE = 550, TURN_SECONDS = 60;

// --- languages ---------------------------------------------------------------

const RULES_NL = `
<p>Wie als eerste al zijn stenen kwijt is, wint het spel.</p>
<h3>De stenen</h3>
<p>Er zijn 106 stenen: de getallen 1 tot en met 13 in vier kleuren (zwart, rood, blauw en oranje), elk twee keer, en twee jokers. Iedereen krijgt er 14; de rest is de pot. Wie bij het trekken de hoogste steen pakt, begint; daarna gaat de beurt met de klok mee.</p>
<h3>Reeksen</h3>
<ul>
<li>Een <b>groep</b> is drie of vier stenen met hetzelfde getal, elk in een andere kleur.</li>
<li>Een <b>rij</b> is drie of meer opeenvolgende getallen in één kleur. De 1 is altijd de laagste: na 13 komt geen 1.</li>
<li>Een <b>joker</b> kan elke steen zijn die een reeks nodig heeft.</li>
</ul>
<h3>Je eerste zet</h3>
<p>De eerste keer dat je uitlegt, moeten je reeksen samen minstens 30 punten waard zijn, en alleen uit stenen van je eigen plankje bestaan. Een steen is zijn getal waard; een joker telt als de steen die hij vervangt. Pas vanaf je volgende beurt mag je aanleggen en schuiven.</p>
<h3>Je beurt</h3>
<p>Leg stenen uit, of pak een steen uit de pot; daarmee is je beurt voorbij. Wie niets van zijn plankje legt, moet een steen pakken. Een steen die je net gepakt hebt, kun je pas de volgende beurt spelen.</p>
<h3>Schuiven</h3>
<p>Na je eerste zet mag je de reeksen op tafel aanvullen, splitsen en anders indelen, ook met jokers, zolang aan het eind van je beurt alles op tafel een geldige groep of rij is en je minstens één steen van je plankje hebt gelegd. Stenen die al op tafel lagen, gaan nooit terug naar een plankje.</p>
<h3>Het einde</h3>
<p>Wie uit is, wint het spel. De anderen tellen de stenen op hun plankje als minpunten (een joker is 30); de winnaar krijgt ze samen als pluspunten. Is de pot leeg en kan niemand meer, dan wint wie het minst overhoudt; de anderen krijgen het verschil met de winnaar als minpunten.</p>
<h3>Tijd</h3>
<p>Met <i>Eén minuut per beurt</i> aan (in Menu → Opties) heb je een minuut. Ben je dan niet klaar, dan pak je een steen; had je al geschoven, dan gaat alles terug en pak je er drie.</p>
<h3>Zo speel je hier</h3>
<p>Sleep stenen van je plankje naar de tafel: op een reeks om aan te leggen, of naar het lege vak om een nieuwe te beginnen. Tik stenen aan om er meer tegelijk te slepen, of tik daarna op een reeks of het lege vak om ze erheen te leggen. Wat nog geen geldige reeks is, kleurt rood. Een steen die je deze beurt hebt gelegd, kun je terugslepen naar je plankje; <i>Terugzetten</i> zet alles terug zoals het aan het begin van je beurt lag. Stenen die een tegenstander net legde, zijn geel omrand.</p>`;

const RULES_EN = `
<p>The first player to get rid of all their tiles wins the game.</p>
<h3>The tiles</h3>
<p>There are 106 tiles: the numbers 1 to 13 in four colours (black, red, blue and orange), twice each, and two jokers. Everyone gets 14; the rest is the pool. Whoever draws the highest tile starts; then play goes clockwise.</p>
<h3>Sets</h3>
<ul>
<li>A <b>group</b> is three or four tiles of the same number, each in a different colour.</li>
<li>A <b>run</b> is three or more consecutive numbers in one colour. 1 is always the lowest: no 1 after 13.</li>
<li>A <b>joker</b> can be any tile a set needs.</li>
</ul>
<h3>Your first meld</h3>
<p>The first time you lay down tiles, your sets must be worth at least 30 points together, and use only tiles from your own rack. A tile is worth its number; a joker counts as the tile it stands for. Only from your next turn on may you add to and rearrange the table.</p>
<h3>Your turn</h3>
<p>Lay down tiles, or draw one from the pool, which ends your turn. If you lay down nothing from your rack, you must draw. A tile you just drew can only be played on a later turn.</p>
<h3>Rearranging</h3>
<p>After your first meld you may add to, split and regroup the sets on the table, jokers too, as long as at the end of your turn everything on the table is a valid group or run and you have played at least one tile from your rack. Tiles that were on the table never go back to a rack.</p>
<h3>The end</h3>
<p>Whoever goes out wins the game. The others count the tiles on their rack as minus points (a joker is 30); the winner gets their total as plus points. If the pool is empty and nobody can play, whoever has the least left wins; the others score the difference with the winner as minus points.</p>
<h3>Time</h3>
<p>With <i>One minute per turn</i> on (in Menu → Options) you have a minute. If you're not done by then, you draw a tile; if you had moved tiles, everything goes back and you draw three.</p>
<h3>Playing here</h3>
<p>Drag tiles from your rack to the table: onto a set to add to it, or to the empty box to start a new one. Tap tiles to drag several at once, or tap a set or the empty box afterwards to put them there. Anything that isn't a valid set yet turns red. A tile you laid down this turn can be dragged back to your rack; <i>Undo</i> puts everything back as it was at the start of your turn. Tiles an opponent just played have a yellow edge.</p>`;

let lang = "nl";
if (!TEST) try {
  const saved = localStorage.getItem("solfege.lang");     // shared with the solfège and piano pages
  if (saved && Object.hasOwn(STRINGS, saved)) lang = saved;
} catch {}
function t(key, ...args) {
  const text = STRINGS[lang][key];
  return typeof text === "function" ? text(...args) : text;
}
// Text that is kept and shown later is kept as [key, ...args], so it follows a change of language.
const say = msg => msg ? t(...msg) : "";
const tileName = id => TILES[id].joker ? t("joker") : t("tileName", TILES[id].c, TILES[id].v);

// --- settings ----------------------------------------------------------------

const LEVELS = ["easy", "strong", "optimal"];
const settings = {opponents: 3, level: "strong", timer: false};
if (!TEST) try { Object.assign(settings, JSON.parse(localStorage.getItem("rummy.settings")) ?? {}); } catch {}
{
  const n = Number(params.get("opponents"));
  if ([1, 2, 3].includes(n)) settings.opponents = n;
  if (![1, 2, 3].includes(settings.opponents)) settings.opponents = 3;
  if (!LEVELS.includes(settings.level)) settings.level = "strong";
}
const saveSettings = () => { if (!TEST) try { localStorage.setItem("rummy.settings", JSON.stringify(settings)); } catch {} };

// --- the game ----------------------------------------------------------------

let game = null;
let sheet = [];               // the scores of the games so far: [{points: [...], winner}]
const timers = new Set();
const ui = {selected: new Set(), press: null, pendingRender: false, warnUntil: 0};

function later(fn, ms) {
  const id = setTimeout(() => { timers.delete(id); fn(); }, TEST ? 0 : ms);
  timers.add(id);
}
function shuffle(list) {
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  return list;
}
const me = () => game.players[0];
const current = () => game.players[game.current];
const myTurn = () => game && !game.over && game.current === 0;
const nameOf = p => p.human ? null : p.name;

// --- the computer players' moves --------------------------------------------------
//
// The moves are worked out in a Web Worker (worker.js), away from the page, so
// that even a long think never stops it; the worker uses the WebAssembly solver
// when it loads, and else rules.js's own. Without a worker (an old browser, or
// the page opened as a file) the page works them out itself, with rules.js.
// ?solver=js keeps the worker to JavaScript, and ?solver=main does without it.
const brain = {worker: null, solver: "main", asked: 0, turn: 0, waiting: new Map()};
if (params.get("solver") !== "main" && typeof Worker === "function") {
  try {
    brain.worker = new Worker(params.get("solver") === "js" ? "worker.js?solver=js" : "worker.js");
    brain.solver = "js";
    brain.worker.onmessage = e => {
      if (e.data.solver) brain.solver = e.data.solver;            // "wasm" once it has loaded
      const done = brain.waiting.get(e.data.id);
      brain.waiting.delete(e.data.id);
      done?.(e.data.move);
    };
    // A worker that fails (it couldn't load, say): the page works the moves out itself from then on.
    brain.worker.onerror = () => {
      brain.worker = null;
      brain.solver = "main";
      for (const done of brain.waiting.values()) done(undefined);
      brain.waiting.clear();
    };
  } catch {
    brain.worker = null;
  }
}

// A computer player's move (see computerMove in rules.js), as a promise.
function thinkOf(table, rack, melded, level) {
  const here = () => computerMove(table, rack, melded, level);
  if (!brain.worker) return Promise.resolve(here());
  return new Promise(resolve => {
    const id = ++brain.asked;
    brain.waiting.set(id, move => resolve(move === undefined ? here() : move));
    brain.worker.postMessage({id, table, rack, melded, level});
  });
}

// --- keeping the game ------------------------------------------------------------
//
// The game is kept in the browser at the start of every turn and after each of
// your moves, so a reload carries on where it was: an accidental one, a phone
// that dropped the page, or a development server that reloads on every change.
// It is not kept the moment a turn ends, so a reload then gives that turn
// back as it began, never a second one. With ?test it is only kept with &keep.
const KEEP = !TEST || params.has("keep");
const GAME_KEY = TEST ? "rummy.test-game" : "rummy.game";

function saveGame() {
  if (!KEEP || !game) return;
  try {
    localStorage.setItem(GAME_KEY, JSON.stringify({version: 1, game: {...game, recent: [...game.recent]}, sheet}));
  } catch {}
}

// Carries on with the kept game if there is one for this number of players;
// a finished one goes on to the next game, with its scores.
function resumeGame() {
  if (!KEEP) return false;
  let saved;
  try { saved = JSON.parse(localStorage.getItem(GAME_KEY)); } catch { return false; }
  const kept = saved?.version === 1 ? saved.game : null;
  if (!kept || kept.players?.length !== settings.opponents + 1) return false;
  const all = [...kept.players.flatMap(p => p.rack), ...kept.table.flat(), ...kept.pool].sort((a, b) => a - b);
  if (all.length !== TILES.length || all.some((id, i) => id !== i)) return false;   // not a whole game: start afresh
  sheet = Array.isArray(saved.sheet) ? saved.sheet : [];
  if (kept.over) { newGame(false); return true; }
  game = {...kept, recent: new Set(kept.recent)};
  game.players[0].name = t("you");
  if (myTurn()) {               // your turn, with the moves you had made in it
    startClock();
    render();
  } else {                      // an opponent's turn begins again
    beginTurn();
  }
  return true;
}

function newGame(clearScores) {
  for (const id of timers) clearTimeout(id);
  timers.clear();
  brain.turn++;
  stopClock();
  if (clearScores) sheet = [];
  const pool = shuffle(TILES.map(tile => tile.id));
  const players = [{human: true, seat: "bottom", name: t("you")},
                   ...SEATS[settings.opponents].map((seat, i) => ({human: false, seat, name: NAMES[i]}))];
  for (const p of players) Object.assign(p, {rack: pool.splice(0, 14), melded: false, said: null});
  // Everyone draws a tile; the highest starts, and a tie draws again.
  let picks, top;
  do {
    const bag = shuffle(TILES.filter(tile => !tile.joker).map(tile => tile.v));
    picks = players.map((_, i) => bag[i]);
    top = Math.max(...picks);
  } while (picks.filter(v => v === top).length > 1);
  const starter = picks.indexOf(top);
  players.forEach((p, i) => { if (!p.human) p.said = ["picked", picks[i]]; });
  game = {players, pool, table: [], current: starter, over: false, passes: 0,
          start: {table: [], rack: players[starter].rack.slice(), melded: false},
          recent: new Set(), drawn: null, status: ["starts", nameOf(players[starter]), top], deadline: 0};
  ui.selected.clear();
  saveGame();
  render();
  later(beginTurn, starter === 0 ? 0 : 1200);
}

function beginTurn() {
  const p = current();
  game.start = {table: game.table.map(set => set.slice()), rack: p.rack.slice(), melded: p.melded};
  saveGame();
  if (p.human) {
    game.status = null;
    ui.selected.clear();
    startClock();
    render();
  } else {
    // The thinking starts at once, and the move comes after the pause or the
    // thinking, whichever is longer; unless by then the turn is no longer
    // this one (a new game, say).
    render();
    const turn = ++brain.turn;
    const thought = thinkOf(game.table, p.rack, p.melded, settings.level);
    later(() => thought.then(move => { if (turn === brain.turn) computerTurn(move); }), THINK);
  }
}

function nextTurn() {
  if (game.over) return;
  game.current = (game.current + 1) % game.players.length;
  beginTurn();
}

// Draws a tile, or passes if the pool is empty; the game is over once everyone
// in a row has had to pass.
function drawFor(p, n = 1) {
  if (!game.pool.length) {
    p.said = ["saidPass"];
    game.passes++;
    if (game.passes >= game.players.length) { endGame(null); return false; }
    return true;
  }
  for (let i = 0; i < n && game.pool.length; i++) {
    const id = game.pool.pop();
    p.rack.push(id);
    if (p.human) game.drawn = id;
  }
  p.said = n === 3 ? ["saidPenalty"] : p.human ? ["saidDrewTile", game.drawn] : ["saidDraw"];
  return true;
}

// Plays the move a computer player came up with, or draws if there is none.
function computerTurn(move) {
  if (game.over) return;
  const p = current();
  if (move) {
    const opening = !p.melded;
    game.table = move.table;
    p.rack = move.rack;
    p.melded = true;
    game.passes = 0;
    for (const id of move.placed) game.recent.add(id);
    p.said = opening ? ["saidMeld", meldPoints(move.table, move.placed)] : ["saidPlay", move.placed.length];
    if (!p.rack.length) { endGame(game.current); return; }
  } else if (!drawFor(p)) {
    return;
  }
  render();
  later(nextTurn, PAUSE);
}

// The points of the sets made only of these tiles: what counts for a first meld.
function meldPoints(table, placed) {
  const mine = new Set(placed);
  return table.filter(set => set.every(id => mine.has(id))).reduce((s, set) => s + (analyse(set)?.points ?? 0), 0);
}

// The tiles you have put on the table this turn.
function placedNow() {
  if (!myTurn()) return new Set();
  const rack = new Set(me().rack);
  return new Set(game.start.rack.filter(id => !rack.has(id)));
}
const tableChanged = () => JSON.stringify(game.table) !== JSON.stringify(game.start.table);

function undoTurn() {
  game.table = game.start.table.map(set => set.slice());
  const rack = new Set(me().rack);
  // Keep the rack in the order you gave it, with the tiles coming back at the end.
  me().rack = me().rack.filter(id => game.start.rack.includes(id))
    .concat(game.start.rack.filter(id => !rack.has(id)));
  ui.selected.clear();
}

// The big button: Done if you have played tiles, or else draw (or pass).
function finishTurn() {
  if (!myTurn()) return;
  const placed = placedNow();
  if (!placed.size) {
    const changed = tableChanged();
    undoTurn();
    if (!drawFor(me())) return;
    game.status = changed ? ["nothingFromRack"] : me().said[0] === "saidPass" ? ["youPassed"] : ["youDrew", game.drawn];
    return endMyTurn();
  }
  if (game.table.some(set => !analyse(set))) return message(t("errInvalid"));
  const opening = !game.start.melded;
  if (opening) {
    const points = meldPoints(game.table, [...placed]);
    if (points < 30) return message(t("errMeld", points));
    me().said = ["saidMeld", points];
  } else {
    me().said = ["saidPlay", placed.size];
  }
  me().melded = true;
  game.passes = 0;
  game.drawn = null;
  if (!me().rack.length) { stopClock(); endGame(0); return; }
  game.status = null;
  endMyTurn();
}

function endMyTurn() {
  stopClock();
  game.recent.clear();
  ui.selected.clear();
  render();
  later(nextTurn, PAUSE);
}

function timeUp() {
  if (!myTurn()) return;
  closeDialog();
  const moved = placedNow().size > 0 || tableChanged();
  undoTurn();
  if (!drawFor(me(), moved ? 3 : 1)) return;
  game.status = [moved ? "timeUpPenalty" : "timeUp"];
  endMyTurn();
}

function endGame(winner) {
  game.over = true;
  stopClock();
  const values = game.players.map(p => rackValue(p.rack));
  let points;
  const blocked = winner === null;
  if (blocked) {
    const low = Math.min(...values);
    winner = values.indexOf(low);
    points = values.map(v => low - v);
  } else {
    points = values.map(v => -v);
  }
  points[winner] = -points.reduce((s, x, i) => i === winner ? s : s + x, 0);
  sheet.push({points, winner});
  game.players[winner].said = ["saidOut"];
  game.status = [blocked ? "wonBlocked" : "wonOut", nameOf(game.players[winner])];
  saveGame();
  render();
  later(() => showScores(game.status), 900);
}

// --- moving tiles --------------------------------------------------------------

// Whether you may pick up this tile: your rack's always (to rearrange it); on
// your turn also the table's, but before your first meld only your own new ones.
function canMove(id) {
  if (!game || game.over) return false;
  if (me().rack.includes(id)) return true;
  if (!myTurn()) return false;
  return game.start.melded || placedNow().has(id);
}

// Moves tiles to a set ({set: i, at}), a new set ({set: "new"}) or the rack
// ({rack: true, at}); `at` counts the tiles there that aren't moving. A run
// that loses a tile from its middle falls apart in two.
function moveTiles(ids, target) {
  const moving = new Set(ids);
  if (target.rack) {
    if (ids.some(id => !me().rack.includes(id) && !(myTurn() && game.start.rack.includes(id)))) return warn("errBack");
  } else {
    if (!myTurn()) return;
    if (target.set !== "new" && !game.start.melded) {
      const placed = placedNow();
      if (game.table[target.set].some(id => !placed.has(id) && !moving.has(id))) return warn("errLocked");
    }
  }
  const rack = me().rack.filter(id => !moving.has(id));
  const table = [];
  game.table.forEach((set, i) => {
    let rest = set.filter(id => !moving.has(id));
    if (i === target.set) {
      rest.splice(Math.min(target.at, rest.length), 0, ...ids);
      table.push(normalize(rest));
      return;
    }
    if (rest.length === set.length) { table.push(set); return; }
    if (analyse(set)?.run) {
      let piece = [];
      for (const id of set) {
        if (moving.has(id)) { if (piece.length) table.push(piece); piece = []; } else piece.push(id);
      }
      if (piece.length) table.push(piece);
    } else if (rest.length) {
      table.push(rest);
    }
  });
  if (target.set === "new") table.push(normalize(ids));
  if (target.rack) rack.splice(Math.min(target.at, rack.length), 0, ...ids);
  game.table = table;
  me().rack = rack;
  ui.selected.clear();
  if (game.drawn !== null && !rack.includes(game.drawn)) game.drawn = null;
  if (myTurn()) saveGame();
  render();
}

function sortRack(byColour) {
  const key = id => TILES[id].joker ? [99, 99] : byColour ? [TILES[id].c, TILES[id].v] : [TILES[id].v, TILES[id].c];
  me().rack.sort((a, b) => { const [x, y] = [key(a), key(b)]; return x[0] - y[0] || x[1] - y[1]; });
  if (myTurn()) saveGame();
  render();
}

// --- drawing the page ------------------------------------------------------------

const JOKER_FACE = `<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="7" cy="8" r="1.3" fill="currentColor"/><circle cx="13" cy="8" r="1.3" fill="currentColor"/><path d="M5.8 11.6q4.2 4.6 8.4 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;

function tileEl(id, rep) {
  const tile = TILES[id], el = document.createElement("div");
  el.className = `tile k${tile.c}`;
  el.dataset.id = id;
  if (tile.joker) {
    el.innerHTML = JOKER_FACE + (rep ? `<span class="rep">${rep.v}</span>` : "");
    el.title = rep ? `${t("joker")}: ${t("tileName", rep.c, rep.v)}` : t("joker");
  } else {
    el.textContent = tile.v;
  }
  el.setAttribute("aria-label", tileName(id));
  return el;
}
function backEl() {
  const el = document.createElement("div");
  el.className = "tile back";
  return el;
}

function render() {
  if (!game) return;
  if (ui.press?.dragging) { ui.pendingRender = true; return; }
  ui.pendingRender = false;
  const mine = myTurn(), placed = placedNow();

  for (const seat of ["left", "top", "right"]) {
    const el = $(`#seat-${seat}`), p = game.players.find(p => p.seat === seat);
    el.hidden = !p;
    if (!p) continue;
    el.classList.toggle("active", !game.over && current() === p);
    el.querySelector(".name").textContent = p.name;
    el.querySelector(".count").textContent = t("tiles", p.rack.length);
    el.querySelector(".said").textContent = say(p.said);
    // Face down while the game is on; face up once it is over.
    el.querySelector(".hand").replaceChildren(...p.rack.map(id => game.over ? tileEl(id) : backEl()));
  }
  const bottom = $("#seat-bottom");
  bottom.classList.toggle("active", mine);
  bottom.querySelector(".name").textContent = t("you");
  bottom.querySelector(".said").textContent = say(me().said);

  const table = $("#table");
  table.replaceChildren();
  game.table.forEach((set, i) => {
    const el = document.createElement("div"), a = analyse(set);
    el.className = "set";
    el.dataset.set = i;
    if (!a) el.classList.add("bad");
    if (mine && !game.start.melded && set.some(id => !placed.has(id))) el.classList.add("locked");
    set.forEach((id, j) => {
      const tile = tileEl(id, a?.reps[j]);
      if (placed.has(id)) tile.classList.add("mine");
      if (game.recent.has(id)) tile.classList.add("recent");
      if (ui.selected.has(id)) tile.classList.add("sel");
      if (canMove(id)) tile.classList.add("can");
      el.append(tile);
    });
    table.append(el);
  });
  if (mine) {
    const el = document.createElement("div");
    el.className = "newset";
    el.textContent = "+ " + t("newSet");
    table.append(el);
  } else if (!game.table.length) {
    const el = document.createElement("div");
    el.className = "empty-table";
    el.textContent = t("emptyTable");
    table.append(el);
  }

  $("#rack").replaceChildren(...me().rack.map(id => {
    const tile = tileEl(id);
    if (id === game.drawn) tile.classList.add("new");
    if (ui.selected.has(id)) tile.classList.add("sel");
    if (!game.over) tile.classList.add("can");
    return tile;
  }));

  const go = $("#go");
  go.textContent = placed.size ? t("done") : game.pool.length ? t("draw") : t("pass");
  go.disabled = !mine;
  $("#reset").disabled = !mine || (!placed.size && !tableChanged());
  $("#sort-num").disabled = $("#sort-color").disabled = game.over;

  renderStatus();
  $("#pool").textContent = t("pool", game.pool.length);
  for (const b of document.querySelectorAll("[data-act=opp]")) b.setAttribute("aria-checked", Number(b.dataset.n) === settings.opponents);
  requestAnimationFrame(layoutHands);
}

function renderStatus() {
  const el = $("#status");
  if (Date.now() < ui.warnUntil) return;
  el.classList.remove("warn");
  let text = say(game.status);
  if (!text && myTurn()) {
    text = !game.start.melded ? t("yourFirst", meldPoints(game.table, [...placedNow()]))
         : game.pool.length ? t("yourTurn") : t("yourTurnEmpty");
  }
  if (!text && !game.over) text = t("theirTurn", current().name);
  el.textContent = text;
}

// A short warning in the status bar, for a move that isn't allowed.
function warn(key) {
  const el = $("#status");
  el.textContent = t(key);
  el.classList.add("warn");
  ui.warnUntil = Date.now() + 3500;
  later(() => { ui.warnUntil = 0; if (game) renderStatus(); }, 3600);
}

// The opponents' tiles overlap as much as they must to fit along their side.
function layoutHands() {
  for (const hand of document.querySelectorAll(".seat:not([hidden]) .hand")) {
    const tiles = [...hand.children];
    if (!tiles.length) continue;
    const vertical = hand.classList.contains("v");
    const w = tiles[0].offsetWidth, h = tiles[0].offsetHeight;
    const room = vertical ? hand.clientHeight : hand.clientWidth;
    const step = tiles.length > 1 ? Math.max(3, Math.min(w + 2, (room - w) / (tiles.length - 1))) : 0;
    const start = Math.max(0, (room - (step * (tiles.length - 1) + w)) / 2);
    tiles.forEach((tile, i) => {
      if (vertical) {
        // Turned a quarter, a tile is w tall and h wide; place its box so that shows where it should.
        tile.style.left = `${(hand.clientWidth - w) / 2}px`;
        tile.style.top = `${start + i * step + (w - h) / 2}px`;
      } else {
        tile.style.left = `${start + i * step}px`;
        tile.style.top = "0";
      }
    });
  }
}
addEventListener("resize", () => requestAnimationFrame(layoutHands));

// --- the clock -----------------------------------------------------------------

let clockTimer = 0;
function startClock() {
  stopClock();
  if (!settings.timer) return;
  game.deadline = Date.now() + TURN_SECONDS * 1000;
  const tick = () => {
    const left = Math.max(0, Math.ceil((game.deadline - Date.now()) / 1000));
    $("#clock").textContent = `⏱ ${left}`;
    if (left <= 0) { stopClock(); timeUp(); }
  };
  $("#clock").hidden = false;
  tick();
  clockTimer = setInterval(tick, 250);
}
function stopClock() {
  clearInterval(clockTimer);
  clockTimer = 0;
  $("#clock").hidden = true;
}

// --- dragging and tapping tiles ----------------------------------------------------

// Where a point on the page would drop tiles: on a set, the new-set box or the
// table (a new set), or your rack.
function targetAt(x, y, ids) {
  const el = document.elementFromPoint(x, y);
  if (!el) return null;
  const set = el.closest(".set");
  if (set) return {set: Number(set.dataset.set), at: indexAt(set, x, y, ids), el: set};
  if (el.closest(".newset, #table")) return myTurn() ? {set: "new", el: $(".newset")} : null;
  if (el.closest("#seat-bottom")) return {rack: true, at: indexAt($("#rack"), x, y, ids), el: $("#rack")};
  return null;
}
// The place among the tiles in a box (leaving out those being moved) that a
// point is at, reading the rows like text.
function indexAt(box, x, y, ids) {
  const tiles = [...box.querySelectorAll(".tile")].filter(el => !ids.includes(Number(el.dataset.id)));
  const i = tiles.findIndex(el => {
    const r = el.getBoundingClientRect();
    return y < r.top || (y <= r.bottom && x < r.left + r.width / 2);
  });
  return i < 0 ? tiles.length : i;
}

const tabletop = $("#tabletop");
tabletop.addEventListener("pointerdown", e => {
  if (e.button !== 0 || !game || !$("#layer").hidden) return;
  const tile = e.target.closest(".tile[data-id]");
  if (!tile || !tile.closest("#rack, #table")) return;
  const id = Number(tile.dataset.id);
  if (!canMove(id)) return;
  e.preventDefault();
  ui.press = {id, x: e.clientX, y: e.clientY, pointerId: e.pointerId, dragging: false};
});
addEventListener("pointermove", e => {
  const press = ui.press;
  if (!press || e.pointerId !== press.pointerId) return;
  if (!press.dragging) {
    if (Math.hypot(e.clientX - press.x, e.clientY - press.y) < 6) return;
    startDrag(press);
  }
  press.ghost.style.left = `${e.clientX - press.dx}px`;
  press.ghost.style.top = `${e.clientY - press.dy}px`;
  const target = targetAt(e.clientX, e.clientY, press.ids);
  if (target?.el !== press.over) {
    press.over?.classList.remove("over");
    press.over = target?.el ?? null;
    press.over?.classList.add("over");
  }
});
addEventListener("pointerup", e => {
  const press = ui.press;
  if (!press || e.pointerId !== press.pointerId) return;
  ui.press = null;
  if (!press.dragging) { toggleSelected(press.id); return; }
  endDrag(press);
  const target = targetAt(e.clientX, e.clientY, press.ids);
  if (target) moveTiles(press.ids, target);
  else render();
});
addEventListener("pointercancel", e => {
  const press = ui.press;
  if (!press || e.pointerId !== press.pointerId) return;
  ui.press = null;
  if (press.dragging) { endDrag(press); render(); }
});

function startDrag(press) {
  press.dragging = true;
  // Drag everything selected if the tile is selected, else just this one.
  const selected = [...document.querySelectorAll(".tile.sel")].map(el => Number(el.dataset.id));
  press.ids = ui.selected.has(press.id) ? selected.filter(canMove) : [press.id];
  const ghost = document.createElement("div");
  ghost.className = "ghost";
  for (const id of press.ids) ghost.append(tileEl(id));
  document.body.append(ghost);
  const grabbed = document.querySelector(`.tile[data-id="${press.id}"]`).getBoundingClientRect();
  const width = parseFloat(getComputedStyle(ghost.firstChild).width);
  press.dx = (press.x - grabbed.left) * width / grabbed.width + press.ids.indexOf(press.id) * (width + 2);
  press.dy = (press.y - grabbed.top) * width / grabbed.width;
  press.ghost = ghost;
  for (const id of press.ids) document.querySelector(`.tile[data-id="${id}"]`)?.classList.add("dragging");
}
function endDrag(press) {
  press.ghost.remove();
  press.over?.classList.remove("over");
  for (const el of document.querySelectorAll(".tile.dragging")) el.classList.remove("dragging");
}

function toggleSelected(id) {
  if (ui.selected.has(id)) ui.selected.delete(id); else ui.selected.add(id);
  document.querySelector(`.tile[data-id="${id}"]`)?.classList.toggle("sel", ui.selected.has(id));
}

// A tap next to the tiles: put the selected tiles there, or else let go of them.
tabletop.addEventListener("click", e => {
  if (!game || e.target.closest(".tile")) return;
  if (!ui.selected.size) return;
  const ids = [...document.querySelectorAll(".tile.sel")].map(el => Number(el.dataset.id)).filter(canMove);
  const target = e.target.closest(".set, .newset, #rack") ? targetAt(e.clientX, e.clientY, ids) : null;
  if (target && ids.length) {
    moveTiles(ids, target.rack || target.set === "new" ? target : {...target, at: Infinity});
  } else {
    ui.selected.clear();
    render();
  }
});

// --- dialogs and menus ---------------------------------------------------------------


let onEscape = null;
function dialog(title, body, buttons, wide = false) {
  const layer = $("#layer");
  const box = document.createElement("div");
  box.className = "dialog" + (wide ? " wide" : "");
  box.setAttribute("role", "dialog");
  box.setAttribute("aria-modal", "true");
  box.innerHTML = `<div class="head"><span class="caption"></span><button type="button" class="close" aria-label="${t("close")}">✕</button></div><div class="body"></div><div class="buttons"></div>`;
  box.querySelector(".caption").textContent = title;
  const content = box.querySelector(".body");
  if (typeof body === "string") content.innerHTML = body; else content.append(body);
  const row = box.querySelector(".buttons");
  for (const b of buttons) {
    const el = document.createElement("button");
    el.type = "button";
    el.className = "btn" + (b.default ? " default" : "");
    el.textContent = b.label;
    el.addEventListener("click", () => { closeDialog(); b.action?.(); });
    row.append(el);
  }
  const cancel = buttons.find(b => b.cancel) ?? buttons[buttons.length - 1];
  onEscape = () => { closeDialog(); cancel.action?.(); };
  box.querySelector(".close").addEventListener("click", onEscape);
  layer.replaceChildren(box);
  layer.hidden = false;
  (row.querySelector(".default") ?? row.firstChild)?.focus();
}
function closeDialog() {
  $("#layer").hidden = true;
  $("#layer").replaceChildren();
  onEscape = null;
}
function message(text) {
  dialog("Tile Rummy", "<p></p>", [{label: t("ok"), default: true}]);
  $("#layer .body p").textContent = text;
}

function showScores(result) {
  const box = document.createElement("div");
  if (result) {
    const p = document.createElement("p");
    p.className = "result";
    p.textContent = say(result);
    box.append(p);
  }
  if (!sheet.length) {
    box.append(t("noGames"));
  } else {
    const table = document.createElement("table");
    table.className = "sheet";
    const names = game.players.map(p => p.human ? t("you") : p.name);
    const cell = (tag, text, cls) => { const c = document.createElement(tag); c.textContent = text; if (cls) c.className = cls; return c; };
    const row = (cells) => { const tr = document.createElement("tr"); tr.append(...cells); return tr; };
    const signed = n => n > 0 ? `+${n}` : String(n);
    const head = document.createElement("thead"), body = document.createElement("tbody"), foot = document.createElement("tfoot");
    head.append(row([cell("th", ""), ...names.map(n => cell("th", n))]));
    sheet.forEach((g, i) => body.append(row([cell("td", t("game", i + 1)),
      ...g.points.map((n, j) => cell("td", signed(n), j === g.winner ? "win" : n < 0 ? "neg" : ""))])));
    foot.append(row([cell("td", t("total")), ...names.map((_, j) => cell("td", signed(sheet.reduce((s, g) => s + g.points[j], 0))))]));
    foot.append(row([cell("td", t("wins")), ...names.map((_, j) => cell("td", String(sheet.filter(g => g.winner === j).length)))]));
    table.append(head, body, foot);
    box.append(table);
  }
  const buttons = game.over
    ? [{label: t("next"), default: true, action: () => newGame(false)}, {label: t("close"), cancel: true}]
    : [{label: t("ok"), default: true}];
  dialog(t("scores").replace("...", ""), box, buttons);
}

function showOptions() {
  const form = document.createElement("form");
  const radio = (name, value, label, checked) =>
    `<label><input type="radio" name="${name}" value="${value}"${checked ? " checked" : ""}> ${label}</label>`;
  form.innerHTML = `
    <fieldset><legend>${t("optOpp")}</legend>
      ${[1, 2, 3].map(n => radio("opponents", n, t("opp" + n), settings.opponents === n)).join("")}
      <p class="note">${t("restartNote")}</p></fieldset>
    <fieldset><legend>${t("optLevel")}</legend>
      ${LEVELS.map(level => radio("level", level, t(level), settings.level === level)).join("")}</fieldset>
    <fieldset><legend>${t("optLang")}</legend>
      ${radio("lang", "nl", "Nederlands", lang === "nl")}${radio("lang", "en", "English", lang === "en")}</fieldset>
    <label><input type="checkbox" name="timer"${settings.timer ? " checked" : ""}> ${t("optTimer")}</label>`;
  form.addEventListener("submit", e => e.preventDefault());
  dialog(t("options").replace("...", ""), form, [
    {label: t("ok"), default: true, action: () => {
      const data = new FormData(form);
      const opponents = Number(data.get("opponents"));
      settings.level = data.get("level");
      const timer = data.get("timer") === "on";
      if (timer !== settings.timer) {
        settings.timer = timer;
        if (myTurn()) { if (timer) startClock(); else stopClock(); }
      }
      saveSettings();
      if (data.get("lang") !== lang) setLanguage(data.get("lang"));
      if (opponents !== settings.opponents) setOpponents(opponents);
    }},
    {label: t("cancel"), cancel: true},
  ]);
}

function setOpponents(n) {
  settings.opponents = n;
  saveSettings();
  newGame(true);
}

// New game, from the menu or F2: ask first if there are scores to lose.
function askNewGame(then = () => newGame(true)) {
  if (!sheet.length && (!game || game.over || !game.players.some(p => p.melded))) { then(); return; }
  dialog("Tile Rummy", `<p>${t("newGameAsk")}</p>`,
         [{label: t("yes"), default: true, action: then}, {label: t("no"), cancel: true}]);
}

function openMenu() {
  ui.menu = true;
  $("#menu").hidden = false;
  $("#menu-button").setAttribute("aria-expanded", "true");
  $("#menu button").focus();
}
function closeMenu() {
  ui.menu = false;
  $("#menu").hidden = true;
  $("#menu-button").setAttribute("aria-expanded", "false");
}
$("#menu-button").addEventListener("click", e => { e.stopPropagation(); ui.menu ? closeMenu() : openMenu(); });
// The arrow keys go through the menu, as in any menu.
$("#menu").addEventListener("keydown", e => {
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  e.preventDefault();
  e.stopPropagation();
  const items = [...$("#menu").querySelectorAll("button")];
  items[(items.indexOf(document.activeElement) + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length].focus();
});
addEventListener("click", e => { if (ui.menu && !e.target.closest(".menu")) closeMenu(); });
for (const item of document.querySelectorAll(".menu [data-act]")) {
  item.addEventListener("click", () => {
    closeMenu();
    const act = item.dataset.act;
    if (act === "new") askNewGame();
    else if (act === "opp") { const n = Number(item.dataset.n); if (n !== settings.opponents) askNewGame(() => setOpponents(n)); }
    else if (act === "scores") showScores(null);
    else if (act === "options") showOptions();
    else if (act === "rules") dialog(t("rules"), t("rulesHtml"), [{label: t("ok"), default: true}], true);
    else if (act === "about") dialog(t("about"), `${t("aboutText")}<p>${t("solver" + brain.solver)}</p>`, [{label: t("ok"), default: true}]);
  });
}

addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (onEscape) onEscape(); else if (ui.menu) { closeMenu(); $("#menu-button").focus(); }
    else if (myTurn() && ui.selected.size) { ui.selected.clear(); render(); }
    return;
  }
  if (e.key === "F2") { e.preventDefault(); askNewGame(); return; }
  if (e.key === "F1") { e.preventDefault(); dialog(t("rules"), t("rulesHtml"), [{label: t("ok"), default: true}], true); return; }
  if (onEscape || e.target.closest("input, button")) return;
  if (e.key === "Enter") finishTurn();
});

$("#go").addEventListener("click", finishTurn);
$("#reset").addEventListener("click", () => { if (myTurn()) { undoTurn(); saveGame(); render(); } });
$("#sort-num").addEventListener("click", () => sortRack(false));
$("#sort-color").addEventListener("click", () => sortRack(true));

// --- language --------------------------------------------------------------------

function setLanguage(name) {
  lang = name;
  if (!TEST) try { localStorage.setItem("solfege.lang", name); } catch {}
  document.documentElement.lang = name;
  for (const el of document.querySelectorAll("[data-t]")) el.textContent = t(el.dataset.t);
  for (const b of document.querySelectorAll("[data-lang]")) b.setAttribute("aria-pressed", b.dataset.lang === name);
  if (game) { game.players[0].name = t("you"); render(); }
}
for (const b of document.querySelectorAll("[data-lang]")) b.addEventListener("click", () => setLanguage(b.dataset.lang));

setLanguage(lang);
if (!resumeGame()) newGame(true);

if (!TEST && "serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(e => console.warn(e));
}
</script>
