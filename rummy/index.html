<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tile Rummy</title>
<!-- Installing it as an app, and the icons; sw.js keeps it for offline use. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161614" media="(prefers-color-scheme: dark)">
<style>
  /* Plain and flat, in the colours of the other pages, around a green table.
     The table and the tiles look the same in light and dark mode. The layout is
     a card table: the opponents along the left, top and right, and you at the bottom. */
  :root {
    --bg: #f7f6f2;            /* the same plain colours as the solfège and piano pages */
    --panel: #ffffff;
    --text: #1d1c1a;
    --muted: #6d6a63;
    --line: #dedbd3;
    --accent: #2f5fb3;
    --accent-soft: #e3ebf9;
    --accent-text: #ffffff;
    --yes: #23753a;
    --no: #b3372f;
    --no-soft: #f8e0dd;
    --table: #007a1f;
    --on-table: #ffffff;
    --on-table-soft: rgba(255, 255, 255, .82);
    --tile: #fdfdfb;
    --tile-line: #b9b5ab;
    --tile-back: #e6e3da;
    --tile-mine: #dde9fb;
    --ink0: #1c1c1c;          /* the four tile colours */
    --ink1: #c8141e;
    --ink2: #1646b8;
    --ink3: #e27500;
    --t: clamp(22px, min(3.2vw, 5.2vh), 42px);   /* width of a tile in your rack */
    --tt: calc(var(--t) * .84);                   /* on the table */
    --to: calc(var(--t) * .62);                   /* in an opponent's hand */
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614;
      --panel: #201f1d;
      --text: #ebe9e4;
      --muted: #9a968d;
      --line: #36342f;
      --accent: #7aa2ec;
      --accent-soft: #233150;
      --accent-text: #10131a;
      --yes: #6fcf87;
      --no: #f08a80;
      --no-soft: #43231f;
    }
  }
  @media (max-width: 640px) {
    :root { --t: clamp(22px, 7.4vw, 32px); }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* --- the page around the game --- */
  .app { position: relative; display: flex; flex-direction: column; margin: auto; }
  /* No bar: two small patches in the page's colour, on the corners of the table. */
  .topbar { position: absolute; z-index: 20; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; padding: 4px; pointer-events: none; user-select: none; }
  .topbar > button, .topbar > .lang, .topbar > .menu { pointer-events: auto; }
  #menu-button { display: grid; place-items: center; flex: none; width: 34px; height: 30px; padding: 0; border: none; border-radius: 6px; background: var(--bg); cursor: pointer; }
  #menu-button svg { width: 18px; height: 18px; }
  #menu-button:hover, #menu-button[aria-expanded=true] { background: var(--accent-soft); }
  #menu-button:focus-visible { outline: 2px solid var(--accent); }
  .topbar .lang { display: flex; flex: none; align-items: center; gap: 2px; height: 30px; padding: 0 3px; border-radius: 6px; background: var(--bg); }
  .topbar .lang button { padding: 2px 6px; border: none; border-radius: 6px; background: none; color: var(--muted); cursor: pointer; }
  .topbar .lang button[aria-pressed=true] { background: var(--accent-soft); color: var(--text); }
  .menu {
    position: absolute;
    z-index: 30;
    top: 100%;
    left: 4px;
    min-width: 190px;
    padding: 4px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
  }
  .menu button {
    position: relative;
    display: flex;
    justify-content: space-between;
    gap: 28px;
    width: 100%;
    padding: 4px 18px 4px 20px;
    border: none;
    border-radius: 5px;
    background: none;
    text-align: left;
    cursor: pointer;
  }
  .menu button:hover, .menu button:focus-visible { background: var(--accent-soft); outline: none; }
  .menu button[aria-checked=true]::before { content: "•"; position: absolute; left: 8px; font-weight: bold; }
  .menu hr { margin: 4px 2px; border: none; border-top: 1px solid var(--line); }

  .btn {
    min-width: 92px;
    padding: 5px 10px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--panel);
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover:not(:disabled) { border-color: var(--muted); }
  .btn.default { border-color: var(--accent); background: var(--accent); color: var(--accent-text); font-weight: 600; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn:disabled { color: var(--muted); background: var(--bg); border-color: var(--line); font-weight: 400; cursor: default; }

  .statusbar { display: flex; gap: 12px; padding: 5px 8px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
  .statusbar > div { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #status { flex: 1; }
  #status.warn { color: var(--no); }
  .app { width: 100vw; height: 100dvh; }

  /* --- the table: opponents left, top and right, you at the bottom --- */
  .tabletop {
    position: relative;
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-rows: auto minmax(0, 1fr) auto;
    padding: 2px;
    background: var(--table);
    color: var(--on-table);
  }
  .seat { display: flex; align-items: center; gap: 4px; min-width: 0; min-height: 0; padding: 6px; }
  #seat-top { grid-area: 1 / 2 / 2 / 3; flex-direction: column; }
  /* The players on the sides start below the patches. A lone opponent at the top keeps clear of them too. */
  #seat-left { grid-area: 1 / 1 / 3 / 2; flex-direction: column; padding-top: 40px; }
  #seat-right { grid-area: 1 / 3 / 3 / 4; flex-direction: column; padding-top: 40px; }
  #seat-left[hidden] ~ #seat-top { padding-inline: 84px; }
  #seat-bottom { grid-area: 3 / 1 / 4 / 4; flex-wrap: wrap; align-items: flex-end; justify-content: center; gap: 6px 14px; padding: 4px 8px 8px; }
  .who { display: flex; flex-direction: column; align-items: center; text-align: center; max-width: 9em; }
  .who .name { padding: 0 6px; border-radius: 6px; font-weight: 600; }
  .seat.active .who .name { background: var(--accent); color: var(--accent-text); }
  .who .count { font-size: 12px; color: var(--on-table-soft); }
  .said { min-height: 1.35em; font-size: 12px; color: var(--on-table-soft); text-align: center; max-width: 11em; }
  #seat-top .said { max-width: none; }
  .hand { position: relative; --w: var(--to); }
  .hand.h { width: 100%; height: calc(var(--to) * 1.36); }
  .hand.v { flex: 1; width: calc(var(--to) * 1.36 + 4px); min-height: 40px; }
  .hand > .tile { position: absolute; }
  .hand.v > .tile { transform: rotate(90deg); }

  #table {
    grid-area: 2 / 2 / 3 / 3;
    --w: var(--tt);
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    justify-content: center;
    gap: 10px 14px;
    min-height: 0;
    padding: 10px 6px;
    overflow: auto;
  }
  .set {
    display: flex;
    gap: 2px;
    padding: 4px;
    border: 1px solid transparent;
    border-radius: 6px;
    background: rgba(0, 0, 0, .16);
  }
  .set.bad { border-color: #ff6a5c; background: rgba(150, 0, 0, .45); }
  .set.locked { opacity: .82; }
  .newset {
    display: grid;
    place-items: center;
    min-width: calc(var(--tt) * 3.4);
    min-height: calc(var(--tt) * 1.36 + 10px);
    padding: 0 8px;
    border: 1px dashed var(--on-table-soft);
    border-radius: 6px;
    color: var(--on-table-soft);
    font-size: 12px;
  }
  .set.over, .newset.over, #rack.over { outline: 2px dashed var(--on-table); outline-offset: 2px; }
  .empty-table { align-self: center; margin: auto; color: var(--on-table-soft); text-align: center; }

  #observing { flex-basis: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; }
  #observing .btn { color: var(--text); }
  .mine { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; flex: 0 1 auto; }
  .mine .who { flex-direction: row; gap: 8px; max-width: none; }
  #rack {
    --w: var(--t);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-content: flex-start;
    gap: 3px;
    width: min(100%, calc((var(--t) + 3px) * 15 + 14px));
    max-height: calc((var(--t) * 1.36 + 3px) * 3 + 14px);
    min-height: calc(var(--t) * 1.36 + 14px);
    padding: 6px;
    overflow-y: auto;
    border-radius: 6px;
    background: rgba(0, 0, 0, .2);
  }
  /* The buttons are on the table but keep the page's colours, for their own text too. */
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; color: var(--text); }
  .controls .wide { grid-column: span 2; }
  @media (max-width: 640px) {
    .controls { grid-template-columns: repeat(4, auto); }
    .controls .wide { grid-column: auto; }
    .controls .btn { min-width: 0; padding: 4px 6px; font-size: 13px; line-height: 1.15; white-space: normal; }
    .seat { padding: 4px 3px; }
    #seat-left, #seat-right { padding-top: 40px; }
    #table { gap: 8px 10px; padding: 8px 4px; }
  }

  /* --- tiles --- */
  .tile {
    --ink: var(--ink0);
    position: relative;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: center;
    width: var(--w);
    height: calc(var(--w) * 1.36);
    border-radius: calc(var(--w) * .14);
    background: var(--tile);
    box-shadow: inset 0 0 0 1px var(--tile-line);
    color: var(--ink);
    font: 700 calc(var(--w) * .56)/1 system-ui, -apple-system, "Segoe UI", sans-serif;
    letter-spacing: -.04em;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  .tile.k1 { --ink: var(--ink1); }
  .tile.k2 { --ink: var(--ink2); }
  .tile.k3 { --ink: var(--ink3); }
  .tile svg { width: 74%; height: auto; }
  .tile .rep { position: absolute; right: 7%; bottom: 4%; font-size: 36%; opacity: .75; }
  .tile.back { background: var(--tile-back); }
  .tile.mine { background: var(--tile-mine); }
  .tile.recent { box-shadow: 0 0 0 2px #ffd400; }
  .tile.new { box-shadow: 0 0 0 2px #8cf58c; }
  .tile.sel { transform: translateY(-5px); box-shadow: 0 0 0 2px #ffffff; }
  .tile.can { cursor: grab; }
  .tile.dragging { opacity: .25; }
  .ghost { position: fixed; z-index: 50; display: flex; gap: 2px; pointer-events: none; --w: var(--t); }
  .ghost .tile { box-shadow: inset 0 0 0 1px var(--tile-line), 0 3px 8px rgba(0, 0, 0, .3); transform: none; }

  /* --- dialogs --- */
  .layer { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 12px; }
  .dialog {
    display: flex;
    flex-direction: column;
    width: min(460px, 100%);
    max-height: calc(100dvh - 24px);
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--panel);
    box-shadow: 0 6px 24px rgba(0, 0, 0, .18);
  }
  .dialog.wide { width: min(620px, 100%); }
  .dialog .head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 0; font-weight: 600; }
  .dialog .caption { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .dialog .close { padding: 0 6px; border: none; border-radius: 6px; background: none; color: var(--muted); cursor: pointer; }
  .dialog .close:hover { background: var(--accent-soft); }
  .dialog .body { padding: 10px 12px 4px; overflow: auto; }
  .dialog .body p { margin: 0 0 10px; }
  .dialog .body h3 { margin: 12px 0 4px; font-size: 1em; }
  .dialog .body ul { margin: 0 0 8px; padding-left: 18px; }
  .dialog .buttons { display: flex; justify-content: flex-end; gap: 6px; padding: 8px 12px 12px; }
  fieldset { margin: 0 0 10px; padding: 6px 10px 8px; border: 1px solid var(--line); border-radius: 8px; }
  legend { padding: 0 4px; color: var(--muted); }
  fieldset label { display: flex; gap: 6px; align-items: center; padding: 2px 0; }
  fieldset .note { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
  .game-row { display: flex; align-items: center; gap: 6px; padding: 6px 0; border-top: 1px solid var(--line); }
  .game-row:first-child { border-top: none; }
  .game-about { flex: 1; min-width: 0; }
  .game-when { color: var(--muted); font-size: 12px; }
  .games-full { color: var(--no); }
  .btn.small { min-width: 0; padding: 3px 8px; }
  .field { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; }
  .field span { min-width: 7em; }
  .field input, .field select, input.link { flex: 1; min-width: 0; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
  .invite-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .sheet { width: 100%; border-collapse: collapse; }
  .sheet th, .sheet td { padding: 3px 8px; text-align: right; white-space: nowrap; }
  .sheet th:first-child, .sheet td:first-child { text-align: left; }
  .sheet thead th { border-bottom: 1px solid var(--line); }
  .sheet tfoot td { border-top: 1px solid var(--line); font-weight: 600; }
  .sheet .win { color: var(--yes); }
  .sheet .neg { color: var(--no); }
  .result { margin-bottom: 10px; font-weight: 600; }
</style>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <button type="button" id="menu-button" aria-label="Menu" title="Menu" aria-haspopup="menu" aria-expanded="false" aria-controls="menu">
      <svg viewBox="0 0 18 18" aria-hidden="true"><path d="M2 4.5h14M2 9h14M2 13.5h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <span class="lang" role="group" aria-label="Taal / Language">
      <button type="button" data-lang="nl" lang="nl" title="Nederlands">NL</button>
      <button type="button" data-lang="en" lang="en" title="English">EN</button>
    </span>
    <div class="menu" id="menu" role="menu" aria-label="Menu" hidden>
      <button type="button" role="menuitem" data-act="new"><span data-t="newGame"></span><span>F2</span></button>
      <button type="button" role="menuitem" data-act="stop"><span data-t="stopGame"></span></button>
      <button type="button" role="menuitem" data-act="games"><span data-t="games"></span></button>
      <button type="button" role="menuitem" data-act="twoTabs"><span data-t="twoTabs"></span></button>
      <button type="button" role="menuitem" data-act="online" hidden><span data-t="playOnline"></span></button>
      <button type="button" role="menuitem" data-act="invite" hidden><span data-t="copyGameLink"></span></button>
      <hr>
      <button type="button" role="menuitemradio" data-act="opp" data-n="1"><span data-t="opp1"></span></button>
      <button type="button" role="menuitemradio" data-act="opp" data-n="2"><span data-t="opp2"></span></button>
      <button type="button" role="menuitemradio" data-act="opp" data-n="3"><span data-t="opp3"></span></button>
      <hr>
      <button type="button" role="menuitem" data-act="scores"><span data-t="scores"></span></button>
      <button type="button" role="menuitem" data-act="options"><span data-t="options"></span></button>
      <hr>
      <button type="button" role="menuitem" data-act="rules"><span data-t="rules"></span><span>F1</span></button>
      <button type="button" role="menuitem" data-act="about"><span data-t="about"></span></button>
    </div>
  </header>
  <div class="tabletop" id="tabletop">
    <div class="seat" id="seat-left" hidden><div class="who"><span class="name"></span><span class="count"></span></div><div class="hand v"></div><div class="said"></div></div>
    <div class="seat" id="seat-top" hidden><div class="hand h"></div><div class="who"><span class="name"></span><span class="count"></span></div><div class="said"></div></div>
    <div class="seat" id="seat-right" hidden><div class="who"><span class="name"></span><span class="count"></span></div><div class="hand v"></div><div class="said"></div></div>
    <div id="table"></div>
    <div class="seat" id="seat-bottom" hidden>
      <div id="observing" hidden><span data-t="observingNote"></span><button type="button" class="btn small" id="play-here" data-t="playHere"></button></div>
      <div class="mine">
        <div class="who"><span class="name"></span><span class="said"></span></div>
        <div id="rack"></div>
      </div>
      <div class="controls">
        <button type="button" class="btn default wide" id="go"></button>
        <button type="button" class="btn wide" id="reset" data-t="reset"></button>
        <button type="button" class="btn" id="sort-num" data-t="sortNum"></button>
        <button type="button" class="btn" id="sort-color" data-t="sortColor"></button>
      </div>
    </div>
  </div>
  <div class="statusbar">
    <div id="status"></div>
    <div id="pool"></div>
    <div id="clock" hidden></div>
  </div>
</div>
<div class="layer" id="layer" hidden></div>

<script src="rules.js"></script>
<script src="room.js"></script>
<script>
"use strict";

// The rules and the computer players are in rules.js, and the record of the game
// in room.js. This page draws the record it receives, and writes a new one when a
// turn ends; it never changes the shared state any other way.

const $ = sel => document.querySelector(sel);
const params = new URLSearchParams(location.search);
// ?test is for test/index.html: no waiting between turns, and nothing kept
// between visits, unless with &keep, or set up with &delay=200 a room as slow as a
// network, &people=2 that many seats for people instead of computer players, and
// &nolocks a browser without Web Locks.
// ?seed=1 deals the same tiles every time. ?game=<id> is the game to open, and
// &seat=1 who you are in it, for a game of two tabs. ?room=<id> is a game played
// online, with &session=a a session of its own in the tests.
const TEST = params.has("test");
let random = Math.random;
if (params.has("seed")) {
  let s = Number(params.get("seed")) >>> 0;
  random = () => {                       // mulberry32
    s = (s + 0x6D2B79F5) >>> 0;
    let x = Math.imul(s ^ s >>> 15, s | 1);
    x ^= x + Math.imul(x ^ x >>> 7, x | 61);
    return ((x ^ x >>> 14) >>> 0) / 4294967296;
  };
}
const NAMES = ["Anna", "Bas", "Carmen"];
const SEATS = {1: ["top"], 2: ["left", "right"], 3: ["left", "top", "right"]};
const THINK = 750, PAUSE = 550, TURN_SECONDS = 60;

// --- languages ---------------------------------------------------------------

const RULES_NL = `
<p>Wie als eerste al zijn stenen kwijt is, wint het spel.</p>
<h3>De stenen</h3>
<p>Er zijn 106 stenen: de getallen 1 tot en met 13 in vier kleuren (zwart, rood, blauw en oranje), elk twee keer, en twee jokers. Iedereen krijgt er 14; de rest is de pot. Wie bij het trekken de hoogste steen pakt, begint; daarna gaat de beurt met de klok mee.</p>
<h3>Reeksen</h3>
<ul>
<li>Een <b>groep</b> is drie of vier stenen met hetzelfde getal, elk in een andere kleur.</li>
<li>Een <b>rij</b> is drie of meer opeenvolgende getallen in één kleur. De 1 is altijd de laagste: na 13 komt geen 1.</li>
<li>Een <b>joker</b> kan elke steen zijn die een reeks nodig heeft.</li>
</ul>
<h3>Je eerste zet</h3>
<p>De eerste keer dat je uitlegt, moeten je reeksen samen minstens 30 punten waard zijn, en alleen uit stenen van je eigen plankje bestaan. Een steen is zijn getal waard; een joker telt als de steen die hij vervangt. Pas vanaf je volgende beurt mag je aanleggen en schuiven.</p>
<h3>Je beurt</h3>
<p>Leg stenen uit, of pak een steen uit de pot; daarmee is je beurt voorbij. Wie niets van zijn plankje legt, moet een steen pakken. Een steen die je net gepakt hebt, kun je pas de volgende beurt spelen.</p>
<h3>Schuiven</h3>
<p>Na je eerste zet mag je de reeksen op tafel aanvullen, splitsen en anders indelen, ook met jokers, zolang aan het eind van je beurt alles op tafel een geldige groep of rij is en je minstens één steen van je plankje hebt gelegd. Stenen die al op tafel lagen, gaan nooit terug naar een plankje.</p>
<h3>Het einde</h3>
<p>Wie uit is, wint het spel. De anderen tellen de stenen op hun plankje als minpunten (een joker is 30); de winnaar krijgt ze samen als pluspunten. Is de pot leeg en kan niemand meer, dan wint wie het minst overhoudt; de anderen krijgen het verschil met de winnaar als minpunten.</p>
<h3>Tijd</h3>
<p>Met <i>Eén minuut per beurt</i> aan (in Menu → Opties) heb je een minuut. Ben je dan niet klaar, dan pak je een steen; had je al geschoven, dan gaat alles terug en pak je er drie.</p>
<h3>Zo speel je hier</h3>
<p>Sleep stenen van je plankje naar de tafel: op een reeks om aan te leggen, of naar het lege vak om een nieuwe te beginnen. Tik stenen aan om er meer tegelijk te slepen, of tik daarna op een reeks of het lege vak om ze erheen te leggen. Wat nog geen geldige reeks is, kleurt rood. Een steen die je deze beurt hebt gelegd, kun je terugslepen naar je plankje; <i>Terugzetten</i> zet alles terug zoals het aan het begin van je beurt lag. Stenen die een tegenstander net legde, zijn geel omrand.</p>`;

const RULES_EN = `
<p>The first player to get rid of all their tiles wins the game.</p>
<h3>The tiles</h3>
<p>There are 106 tiles: the numbers 1 to 13 in four colours (black, red, blue and orange), twice each, and two jokers. Everyone gets 14; the rest is the pool. Whoever draws the highest tile starts; then play goes clockwise.</p>
<h3>Sets</h3>
<ul>
<li>A <b>group</b> is three or four tiles of the same number, each in a different colour.</li>
<li>A <b>run</b> is three or more consecutive numbers in one colour. 1 is always the lowest: no 1 after 13.</li>
<li>A <b>joker</b> can be any tile a set needs.</li>
</ul>
<h3>Your first meld</h3>
<p>The first time you lay down tiles, your sets must be worth at least 30 points together, and use only tiles from your own rack. A tile is worth its number; a joker counts as the tile it stands for. Only from your next turn on may you add to and rearrange the table.</p>
<h3>Your turn</h3>
<p>Lay down tiles, or draw one from the pool, which ends your turn. If you lay down nothing from your rack, you must draw. A tile you just drew can only be played on a later turn.</p>
<h3>Rearranging</h3>
<p>After your first meld you may add to, split and regroup the sets on the table, jokers too, as long as at the end of your turn everything on the table is a valid group or run and you have played at least one tile from your rack. Tiles that were on the table never go back to a rack.</p>
<h3>The end</h3>
<p>Whoever goes out wins the game. The others count the tiles on their rack as minus points (a joker is 30); the winner gets their total as plus points. If the pool is empty and nobody can play, whoever has the least left wins; the others score the difference with the winner as minus points.</p>
<h3>Time</h3>
<p>With <i>One minute per turn</i> on (in Menu → Options) you have a minute. If you're not done by then, you draw a tile; if you had moved tiles, everything goes back and you draw three.</p>
<h3>Playing here</h3>
<p>Drag tiles from your rack to the table: onto a set to add to it, or to the empty box to start a new one. Tap tiles to drag several at once, or tap a set or the empty box afterwards to put them there. Anything that isn't a valid set yet turns red. A tile you laid down this turn can be dragged back to your rack; <i>Undo</i> puts everything back as it was at the start of your turn. Tiles an opponent just played have a yellow edge.</p>`;

function seatFromAddress(from) {
  const seat = Number(from.get("seat") ?? 0);
  return Number.isInteger(seat) && seat >= 0 && seat < 4 ? seat : 0;
}

const LEVELS = ["easy", "strong", "optimal"];

{

  if (![1, 2, 3].includes(settings.opponents)) settings.opponents = 3;

}

// --- the game ----------------------------------------------------------------

// The state has two parts, kept apart so that the shared part could one day go
// to other players as it is.
//
// `game` is what all players share, and is plain JSON: the racks, the pool, the
// table, whose turn it is, what each player said, and the scores of the games so
// far (sheet: [{points: [...], winner}]). During your turn it stays as it was
// when the turn began, and your moves only reach it when you finish.
//
// `view` is this browser's own: your rack in the order you gave it, the table as
// it looks during your unfinished turn, the tile you drew, the tiles just played,
// the status bar's message, and the clock.
let gameId = null, room = null, stopWatching = null;
let mySeat = seatFromAddress(params);                         // which player this tab is
let record = null;            // the record as last received; its state is `game`
let game = null;
let view = null;
const timers = new Set();
const ui = {selected: new Set(), press: null, pendingRender: false, warnUntil: 0,
            sent: -1, thought: -1, ended: -1,     // the turn a move was sent on, thought about, or a game's end shown
            observing: false, lockPending: null, releaseLock: null,    // see "playing or watching"
            computes: false, releaseComputing: null};                  // see "who computes"

function later(fn, ms) {
  const id = setTimeout(() => { timers.delete(id); fn(); }, TEST ? 0 : ms);
  timers.add(id);
}
const me = () => game.players[mySeat];
const current = () => game.players[game.current];
const myTurn = () => game && record.started !== false && !game.over && game.current === mySeat;
// Your turn, not yet sent off, and this is the tab that plays.
const canAct = () => myTurn() && ui.sent !== record.turn && !ui.observing && !ui.lockPending;
// The name to show for a player: null for you, as the messages expect.
const nameOf = p => p === me() ? null : p.name ?? record?.seats[game.players.indexOf(p)]?.name ?? t("opponent");
const copyTable = table => table.map(set => set.slice());
const shownTable = () => myTurn() && view.table && !ui.observing ? view.table : game.table;
// Who sits where, for this browser: you at the bottom, and the others clockwise from your left.
const playerAt = place => {
  const n = game.players.length, i = SEATS[n - 1].indexOf(place);
  return i < 0 ? null : game.players[(mySeat + i + 1) % n];
};
const newView = () => ({round: game.round, rack: me().rack.slice(), table: null, drawn: null, mySaid: null, recent: new Set(),
                        status: ["starts", nameOf(current()), game.top], deadline: 0});
// Brings your rack in line with the shared one, in the order you gave it, with new tiles at the end.
function syncRack() {
  const shared = new Set(me().rack), mine = new Set(view.rack);
  view.rack = view.rack.filter(id => shared.has(id)).concat(me().rack.filter(id => !mine.has(id)));
}

// --- the computer players' moves --------------------------------------------------
//
// The moves are worked out in a Web Worker (worker.js), away from the page, so
// that even a long think never stops it; the worker uses the WebAssembly solver
// when it loads, and else rules.js's own. Without a worker (an old browser, or
// the page opened as a file) the page works them out itself, with rules.js.
// ?solver=js keeps the worker to JavaScript, and ?solver=main does without it.
const brain = {worker: null, solver: "main", asked: 0, turn: 0, waiting: new Map()};
if (params.get("solver") !== "main" && typeof Worker === "function") {
  try {
    brain.worker = new Worker(params.get("solver") === "js" ? "worker.js?solver=js" : "worker.js");
    brain.solver = "js";
    brain.worker.onmessage = e => {
      if (e.data.solver) brain.solver = e.data.solver;            // "wasm" once it has loaded
      const done = brain.waiting.get(e.data.id);
      brain.waiting.delete(e.data.id);
      done?.(e.data.move);
    };
    // A worker that fails (it couldn't load, say): the page works the moves out itself from then on.
    brain.worker.onerror = () => {
      brain.worker = null;
      brain.solver = "main";
      for (const done of brain.waiting.values()) done(undefined);
      brain.waiting.clear();
    };
  } catch {
    brain.worker = null;
  }
}

// A computer player's move (see computerMove in rules.js), as a promise.
// In a game of several people it must come out the same in every browser (pinned).
function thinkOf(table, rack, melded, level, pinned = false) {
  const here = () => computerMove(table, rack, melded, level);
  if (!brain.worker) return Promise.resolve(here());
  return new Promise(resolve => {
    const id = ++brain.asked;
    brain.waiting.set(id, move => resolve(move === undefined ? here() : move));
    brain.worker.postMessage({id, table, rack, melded, level, pinned});
  });
}

// --- keeping the games -----------------------------------------------------------
//
// Every game has an id, in the address (?game=k7f3x9), and is kept in this browser
// under that id, with this browser's view of it, whenever either changes. So a
// reload carries on where it was: an accidental one, a phone that dropped the
// page, or a development server that reloads on every change. Without an id in
// the address, the page opens the game played last. With ?test it is only kept
// with &keep, apart from any real games.
const KEEP = !TEST || params.has("keep");
const LOCKS = TEST && params.has("nolocks") ? null : navigator.locks ?? null;
const STORE = TEST ? "rummy.test." : "rummy.";
const GAME_PREFIX = STORE + "game.", VIEW_PREFIX = STORE + "view.", LAST_KEY = STORE + "last";
const ROOM_PREFIX = STORE + "room.", INVITES_PREFIX = STORE + "invites.";     // online games: see "playing online"
const FINISHED_GAMES_KEPT_MS = 60 * 24 * 3600 * 1000;
const MOST_GAMES = 20, UNTOUCHED_WITHOUT_LOCKS_MS = 3600 * 1000;
const GAME_ID = /^[a-z2-7]{6,32}$/;

function newGameId() {
  const letters = "abcdefghijklmnopqrstuvwxyz234567";
  return Array.from(crypto.getRandomValues(new Uint8Array(10)), byte => letters[byte % 32]).join("");
}

// A game's record has its own place, written only by whoever ends a turn, and each
// seat's view has its own, so that tabs in different seats don't overwrite each other.
function saveRecord(news, updated = Date.now()) {
  if (!KEEP || !gameId || room?.online) return;         // an online game's record is on the server
  try {
    localStorage.setItem(GAME_PREFIX + gameId, JSON.stringify({version: 3, record: news, updated}));
  } catch {}
}
function saveGame() {
  if (!KEEP || !gameId || !view || ui.observing) return;
  try {
    localStorage.setItem(`${VIEW_PREFIX}${gameId}.${mySeat}`, JSON.stringify({...view, recent: [...view.recent]}));
    localStorage.setItem(LAST_KEY, JSON.stringify(room?.online ? {room: gameId} : {id: gameId, seat: mySeat}));
  } catch {}
}
function readView(id, seat) {
  if (!KEEP) return null;
  try { return JSON.parse(localStorage.getItem(`${VIEW_PREFIX}${id}.${seat}`)); } catch { return null; }
}

// A kept game, if there is a good one with this id.
function readGame(id) {
  if (!KEEP || !GAME_ID.test(id ?? "")) return null;
  let saved;
  try { saved = JSON.parse(localStorage.getItem(GAME_PREFIX + id)); } catch { return null; }
  const kept = saved?.version === 3 ? saved.record?.state : null;
  if (!Array.isArray(kept?.players) || !Array.isArray(kept.table) || !Array.isArray(kept.pool) || !Array.isArray(kept.sheet)) return null;
  const all = [...kept.players.flatMap(p => p.rack), ...kept.table.flat(), ...kept.pool].sort((a, b) => a - b);
  if (all.length !== TILES.length || all.some((tileId, i) => tileId !== i)) return null;   // not a whole game
  return saved;
}

// All kept games, the latest first.
function listGames() {
  const games = [];
  if (!KEEP) return games;
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (!key.startsWith(GAME_PREFIX)) continue;
    const id = key.slice(GAME_PREFIX.length), saved = readGame(id);
    if (saved) games.push({id, state: saved.record.state, updated: saved.updated ?? 0});
  }
  return games.sort((a, b) => b.updated - a.updated);
}
function deleteGame(id) {
  try {
    localStorage.removeItem(GAME_PREFIX + id);
    for (let seat = 0; seat < 4; seat++) localStorage.removeItem(`${VIEW_PREFIX}${id}.${seat}`);
  } catch {}
}
// Finished games nobody has opened for a long time don't stay for ever.
function forgetOldGames() {
  for (const {id, state, updated} of listGames()) {
    if (state.over && Date.now() - updated > FINISHED_GAMES_KEPT_MS) deleteGame(id);
  }
}
// A game for one person that nobody has played in yet: their line still says what
// they drew for who starts. It isn't worth keeping once you have left it.
const untouched = state => !state.over && !state.sheet.length
  && state.players.filter(p => p.human).length === 1 && state.players.find(p => p.human).said?.[0] === "picked";

// Keeps the number of games down, leaving alone the one open here and any open in
// another tab: games nobody played in go, and then, above the limit, the oldest,
// finished ones first.
async function tidyGames() {
  if (!KEEP) return;
  let held = null;
  try { held = (await LOCKS?.query())?.held.map(lock => lock.name) ?? null; } catch {}
  const openElsewhere = id => held?.some(name => name.startsWith(`${STORE}play.${id}.`));
  const removable = () => listGames().filter(({id}) => id !== gameId && !openElsewhere(id));
  for (const {id, state, updated} of removable()) {
    // Without locks there is no telling whether another tab has it, so give it time.
    if (untouched(state) && (held || Date.now() - updated > UNTOUCHED_WITHOUT_LOCKS_MS)) deleteGame(id);
  }
  const excess = listGames().length - MOST_GAMES;
  if (excess > 0) {
    const oldestFirst = removable().sort((a, b) => Number(b.state.over) - Number(a.state.over) || a.updated - b.updated);
    for (const {id} of oldestFirst.slice(0, excess)) deleteGame(id);
  }
}

// Whatever no game needs any more: a view whose game is gone, and what older
// versions of this page kept, which this one can't read.
function forgetLeftovers() {
  if (!KEEP) return;
  try {
    for (const key of Object.keys(localStorage)) {
      if (!key.startsWith(VIEW_PREFIX)) continue;
      const id = key.slice(VIEW_PREFIX.length).split(".")[0];
      if (localStorage.getItem(GAME_PREFIX + id) === null && localStorage.getItem(ROOM_PREFIX + id) === null) localStorage.removeItem(key);
    }
    if (!TEST) localStorage.removeItem("rummy.game");
    else localStorage.removeItem("rummy.test-game");
  } catch {}
}

const addressOf = (id, seat) => {
  const url = new URL(location.href);
  url.searchParams.set("game", id);
  if (seat) url.searchParams.set("seat", seat); else url.searchParams.delete("seat");
  return url;
};
function setAddress(id, push) {
  const url = addressOf(id, mySeat);
  if (url.href !== location.href) history[push ? "pushState" : "replaceState"](null, "", url);
}

// --- opening a game -----------------------------------------------------------------

// A computer player's level is the seat's in a game of several people, and so the
// same for everyone; with one person, it follows the options.
const seatsOf = state => {
  const many = state.players.filter(p => p.human).length > 1;
  return state.players.map(p => p.human ? {kind: "person", name: p.name} : {kind: "computer", name: p.name, ...(many ? {level: settings.level} : {})});
};
const severalPeople = () => game.players.filter(p => p.human).length > 1;

// Lets go of the game that is open, and of anything still to happen in it.
function closeGame() {
  for (const timer of timers) clearTimeout(timer);
  timers.clear();
  brain.turn++;
  stopClock();
  closeDialog();
  stopWatching?.();
  stopWatching = null;
  ui.releaseLock?.();
  ui.releaseLock = ui.lockPending = null;
  stopComputing();
  ui.observing = false;
  ui.selected.clear();
  ui.sent = ui.thought = ui.ended = -1;
  record = game = view = null;
  // With no game open, the table stays empty.
  for (const el of document.querySelectorAll(".seat")) el.hidden = true;
  $("#table").replaceChildren();
  $("#status").textContent = $("#pool").textContent = "";
}

function openGame(id, firstRecord, {seat = 0, savedView = null, kept = false, push = false} = {}) {
  // Leaving a game nobody played in, with no tiles moved yet: it isn't kept.
  const leaving = !room?.online && gameId !== id && game && untouched(game) && !(myTurn() && (placedNow().size || tableChanged())) ? gameId : null;
  closeGame();
  if (leaving) deleteGame(leaving);
  gameId = id;
  mySeat = firstRecord.state.players[seat]?.human ? seat : 0;
  // A kept game may be open in another tab already, so wait to hear before playing it.
  claimPlay(id, {wait: kept});
  room = createLocalRoom({record: firstRecord, delay: TEST ? Number(params.get("delay") ?? 0) : 0,
                          keep: saveRecord, latest: () => readGame(gameId)?.record})(mySeat);
  saveRecord(firstRecord);                 // when this game was last opened counts too
  setAddress(id, push);
  receive(firstRecord, savedView);
  stopWatching = room.watch(news => receive(news));
}

function openKeptGame(id, {seat = 0, push = false} = {}) {
  const saved = readGame(id);
  if (saved) openGame(id, saved.record, {seat, savedView: readView(id, seat), kept: true, push});
  return Boolean(saved);
}

// A new game, under a new id. The one before stays in the list of games.
function newGame() {
  const people = TEST ? Number(params.get("people") ?? 1) : 1;
  const players = [{human: true}, ...SEATS[settings.opponents].map((_, i) => ({human: i + 1 < people, name: NAMES[i]}))];
  startGame(players, TEST ? seatFromAddress(params) : 0);
}
function startGame(players, seat = 0) {
  const state = dealGame(players, random).game;
  openGame(newGameId(), {seats: seatsOf(state), current: whoWrites(state), turn: 0, state}, {seat, push: Boolean(game)});
  tidyGames();
}

// A game of two tabs: you against yourself, each tab in its own seat, with any
// computer players.
function newTwoTabGame(computers = 0) {
  startGame([{human: true, name: t("playerN", 1)}, {human: true, name: t("playerN", 2)},
             ...NAMES.slice(0, computers).map(name => ({human: false, name}))]);
  showSecondTab();
}
function askTwoTabs() {
  const form = document.createElement("form");
  form.innerHTML = `<p>${t("twoTabsNote")}</p><fieldset><legend>${t("twoTabsComputers")}</legend>
    ${[0, 1, 2].map(n => `<label><input type="radio" name="computers" value="${n}"${n ? "" : " checked"}> ${n}</label>`).join("")}
    <p class="note">${t("twoTabsLevel", t(settings.level))}</p></fieldset>`;
  dialog(t("twoTabs").replace("...", ""), form, [
    {label: t("ok"), default: true, action: () => newTwoTabGame(Number(new FormData(form).get("computers")))},
    {label: t("cancel"), cancel: true},
  ]);
}
// How to open the other player's tab. window.open needs a click, which this comes from.
const secondTabAddress = () => addressOf(gameId, mySeat === 0 ? 1 : 0).href;
function showSecondTab() {
  dialog(t("twoTabs").replace("...", ""), `<p>${t("twoTabsOpenNote")}</p>`, [
    {label: t("twoTabsOpen"), default: true, action: () => window.open(secondTabAddress(), "_blank")},
    {label: t("close"), cancel: true},
  ]);
}

// The next game after a finished one, under the same id, with the scores.
function nextRound() {
  if (!game?.over) return;
  const players = game.players.map(({human, name}) => ({human, name}));
  const state = dealGame(players, random, game.sheet, game.round + 1).game;
  const writer = record.current;
  room.play({state, current: whoWrites(state)}, writer === mySeat ? {} : {forSeat: writer}).catch(refused);
}
// Whether this tab can start the next game: the winner does, or anyone for a computer player.
const canStartNext = () => !ui.observing && (record.current === mySeat || record.seats[record.current].kind === "computer");

function refused(e) {
  ui.sent = ui.thought = -1;
  console.warn(e);
  if (e.code !== "stale") message(t("notAccepted"));          // if stale, the newer record is on its way
}

// --- receiving a record -------------------------------------------------------------
//
// Every change to the game comes in here: when it opens, after a move of yours,
// after a computer player's, and from another tab. What this browser shows
// follows from the record before and the one that came in.
function receive(news, savedView) {
  const before = record;
  if (before && (news.turn < before.turn || JSON.stringify(news) === JSON.stringify(before))) return;
  const complaint = before ? referee(before, news) : null;
  if (complaint?.reason === "not-a-game") {        // nothing that can be shown, so it stays as it was
    console.warn("Tile Rummy: this isn't a game:", news);
    message(t("moveSuspect", nameOf(game.players[complaint.seat])));
    return;
  }
  record = news;
  game = news.state;

  if (!before) view = restoredView(savedView);
  else if (view.round !== game.round) {
    view = newView();
    closeDialog();                                            // someone else went on from the score sheet
  } else noteRecent(before, news);

  const newTurn = myTurn() && (before ? news.turn !== before.turn || view.table === null : !savedView);
  if (newTurn) {
    view.table = copyTable(game.table);
    view.status = null;
    syncRack();
    ui.selected.clear();
    if (!ui.observing) startClock();
  } else if (myTurn()) {
    if (!before && !ui.observing) startClock();               // your unfinished turn, reopened
  } else {
    view.table = null;
    stopClock();
    syncRack();
  }
  if (game.over && ui.ended !== news.turn) {
    ui.ended = news.turn;
    gameEnded();
  }
  saveGame();
  render();
  followUp();
  if (complaint) {
    console.warn("Tile Rummy: the referee objects to this turn:", complaint.reason, before, news);
    message(t("moveSuspect", nameOf(game.players[complaint.seat])));
  } else if (before) {
    repeatComputerMove(before, news);
  }
}

// The referee only sees whether a move is legal. A computer player's must also be the
// one the solver gives, so every tab that didn't work it out itself repeats it.
function repeatComputerMove(before, news) {
  const seat = before.current, id = gameId;
  if (news.restarted || news.turn !== before.turn + 1 || ui.observing || ui.sent === before.turn) return;
  if (before.state.over || before.seats[seat].kind !== "computer" || !severalPeople()) return;
  const player = before.state.players[seat];
  thinkOf(before.state.table, player.rack, player.melded, before.seats[seat].level, true).then(move => {
    if (gameId !== id) return;
    const expected = stateAfterComputer(before.state, seat, move);
    if (!sameState(expected.over ? expected : advanceTurn(expected), news.state)) {
      console.warn("Tile Rummy: this isn't the solver's move:", seat, move, news);
      message(t("computerSuspect", before.seats[seat].name));
    }
  });
}

// Every browser is a referee: each new record is checked against the one before,
// your own moves too, since this also catches mistakes in the game itself. A record
// that is more than one turn on can't be checked, and a set-up for the tests isn't a turn.
function referee(before, news) {
  if (news.restarted || news.turn !== before.turn + 1) return null;
  const seat = before.current;
  const reason = checkTurn(before.state, news.state, seat) ?? (news.current !== whoWrites(news.state) ? "wrong-next-seat" : null)
    ?? (JSON.stringify(news.seats) !== JSON.stringify(before.seats) ? "seats-changed" : null);
  return reason ? {reason, seat} : null;
}

// What this browser kept of a game, if it still fits; or else a new view.
function restoredView(saved) {
  if (saved?.round !== game.round || !Array.isArray(saved?.rack)) return newView();
  const kept = {...newView(), ...saved, recent: new Set(saved.recent)};
  if (myTurn() && !sameTiles(kept)) {           // the unfinished turn doesn't add up: back to its start
    kept.table = copyTable(game.table);
    kept.rack = me().rack.slice();
  }
  return kept;
}
// Whether your unfinished turn has just the tiles it began with, on the table and the rack.
function sameTiles({table, rack}) {
  if (!table) return false;
  const sorted = list => [...list].sort((a, b) => a - b).join();
  return sorted([...table.flat(), ...rack]) === sorted([...game.table.flat(), ...me().rack]);
}
// The tiles others played since your turn are marked; your own turn clears them.
function noteRecent(before, news) {
  if (news.restarted) return;
  if (before.current === mySeat) { view.recent.clear(); return; }
  const had = new Set(before.state.table.flat());
  for (const id of news.state.table.flat()) if (!had.has(id)) view.recent.add(id);
}

// If the next move is a computer player's, ask for it. The thinking starts at once,
// and the move comes after the pause or the thinking, whichever is longer; unless
// by then the turn is no longer this one (a new game, say).
function followUp() {
  const {turn, current: seat, seats} = record;
  if (!computesHere()) return;
  if (game.over || seats[seat].kind !== "computer" || ui.thought === turn) return;
  ui.thought = turn;
  const token = ++brain.turn, state = game, player = state.players[seat];
  const thought = thinkOf(state.table, player.rack, player.melded, seats[seat].level ?? settings.level, severalPeople());
  later(() => thought.then(move => {
    if (token === brain.turn && record.turn === turn) computerTurn(state, seat, move);
  }), PAUSE + THINK);
}

// Writes the state after a seat's turn. Waiting is up to whoever shows it.
function endTurn(state, seat) {
  ui.sent = record.turn;
  const next = state.over ? state : advanceTurn(state);
  room.play({state: next, current: whoWrites(next)}, seat === mySeat ? {} : {forSeat: seat}).catch(refused);
}

// Plays the move a computer player came up with, or draws if there is none.
function computerTurn(state, seat, move) {
  endTurn(stateAfterComputer(state, seat, move), seat);
}
function stateAfterComputer(state, seat, move) {
  const error = move && checkPlay(state, seat, move.table, move.rack);
  if (error) console.warn("Tile Rummy: a computer player's move was refused", error, move);
  return move && !error ? playTiles(state, seat, move.table, move.rack).game : drawTiles(state, seat).game;
}

// You draw, or pass if the pool is empty. Only you see which tile it was.
function drawForMe(count = 1) {
  const result = drawTiles(game, mySeat, count);
  const last = result.drawn.at(-1) ?? null;
  view.drawn = last;
  view.mySaid = last !== null && count !== 3 ? ["saidDrewTile", last] : null;
  return result.game;
}

// The tiles you have put on the table this turn.
function placedNow() {
  if (!myTurn()) return new Set();
  const rack = new Set(view.rack);
  return new Set(me().rack.filter(id => !rack.has(id)));
}
const tableChanged = () => JSON.stringify(view.table) !== JSON.stringify(game.table);

function undoTurn() {
  view.table = copyTable(game.table);
  syncRack();            // keeps the rack in the order you gave it, with the tiles coming back at the end
  ui.selected.clear();
}

// The big button: Done if you have played tiles, or else draw (or pass).
function finishTurn() {
  if (!canAct()) return;
  const placed = placedNow();
  if (!placed.size) {
    const changed = tableChanged();
    undoTurn();
    const next = drawForMe();
    // No tile drawn means a pass; the line can't tell, as the pass that ends a game says who won.
    view.status = changed ? ["nothingFromRack"] : view.drawn === null ? ["youPassed"] : ["youDrew", view.drawn];
    return sendMyTurn(next);
  }
  const error = checkPlay(game, mySeat, view.table, view.rack);
  if (error) return message(t(...error));
  view.mySaid = null;
  view.drawn = null;
  view.status = null;
  sendMyTurn(playTiles(game, mySeat, view.table, view.rack).game);
}

function sendMyTurn(next) {
  stopClock();
  ui.selected.clear();
  endTurn(next, mySeat);
  render();
}

function timeUp() {
  if (!canAct()) return;
  closeDialog();
  const moved = placedNow().size > 0 || tableChanged();
  undoTurn();
  const next = drawForMe(moved ? 3 : 1);
  view.status = [moved ? "timeUpPenalty" : "timeUp"];
  sendMyTurn(next);
}

// Shows the end of the game; the rules have already scored it.
function gameEnded() {
  const {winner, blocked} = game.result;
  if (winner === mySeat) view.mySaid = null;
  view.status = [blocked ? "wonBlocked" : "wonOut", nameOf(game.players[winner])];
  later(() => showScores(view.status), 900);
}

// --- moving tiles --------------------------------------------------------------

// Whether you may pick up this tile: your rack's always (to rearrange it); on
// your turn also the table's, but before your first meld only your own new ones.
function canMove(id) {
  if (!game || game.over || ui.observing) return false;
  if (view.rack.includes(id)) return true;
  if (!canAct()) return false;
  return me().melded || placedNow().has(id);
}

// Moves tiles to a set ({set: i, at}), a new set ({set: "new"}) or the rack
// ({rack: true, at}); `at` counts the tiles there that aren't moving. A run
// that loses a tile from its middle falls apart in two.
function moveTiles(ids, target) {
  const moving = new Set(ids);
  if (target.rack) {
    if (ids.some(id => !view.rack.includes(id) && !(canAct() && me().rack.includes(id)))) return warn("errBack");
  } else {
    if (!canAct()) return;
    if (target.set !== "new" && !me().melded) {
      const placed = placedNow();
      if (view.table[target.set].some(id => !placed.has(id) && !moving.has(id))) return warn("errLocked");
    }
  }
  const rack = view.rack.filter(id => !moving.has(id));
  const table = [];
  shownTable().forEach((set, i) => {
    let rest = set.filter(id => !moving.has(id));
    if (i === target.set) {
      rest.splice(Math.min(target.at, rest.length), 0, ...ids);
      table.push(normalize(rest));
      return;
    }
    if (rest.length === set.length) { table.push(set); return; }
    if (analyse(set)?.run) {
      let piece = [];
      for (const id of set) {
        if (moving.has(id)) { if (piece.length) table.push(piece); piece = []; } else piece.push(id);
      }
      if (piece.length) table.push(piece);
    } else if (rest.length) {
      table.push(rest);
    }
  });
  if (target.set === "new") table.push(normalize(ids));
  if (target.rack) rack.splice(Math.min(target.at, rack.length), 0, ...ids);
  if (canAct()) view.table = table;
  view.rack = rack;
  ui.selected.clear();
  if (view.drawn !== null && !rack.includes(view.drawn)) view.drawn = null;
  saveGame();
  render();
}

function sortRack(byColour) {
  if (!game || ui.observing) return;
  const key = id => TILES[id].joker ? [99, 99] : byColour ? [TILES[id].c, TILES[id].v] : [TILES[id].v, TILES[id].c];
  view.rack.sort((a, b) => { const [x, y] = [key(a), key(b)]; return x[0] - y[0] || x[1] - y[1]; });
  saveGame();
  render();
}

// --- drawing the page ------------------------------------------------------------

const JOKER_FACE = `<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="7" cy="8" r="1.3" fill="currentColor"/><circle cx="13" cy="8" r="1.3" fill="currentColor"/><path d="M5.8 11.6q4.2 4.6 8.4 0" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;

function tileEl(id, rep) {
  const tile = TILES[id], el = document.createElement("div");
  el.className = `tile k${tile.c}`;
  el.dataset.id = id;
  if (tile.joker) {
    el.innerHTML = JOKER_FACE + (rep ? `<span class="rep">${rep.v}</span>` : "");
    el.title = rep ? `${t("joker")}: ${t("tileName", rep.c, rep.v)}` : t("joker");
  } else {
    el.textContent = tile.v;
  }
  el.setAttribute("aria-label", tileName(id));
  return el;
}
function backEl() {
  const el = document.createElement("div");
  el.className = "tile back";
  return el;
}

function render() {
  if (!game) return;
  if (ui.press?.dragging) { ui.pendingRender = true; return; }
  ui.pendingRender = false;
  const mine = myTurn(), placed = placedNow();

  for (const seat of ["left", "top", "right"]) {
    const el = $(`#seat-${seat}`), p = playerAt(seat);
    el.hidden = !p;
    if (!p) continue;
    el.classList.toggle("active", !game.over && current() === p);
    const seatInfo = record.seats[game.players.indexOf(p)];
    const invited = seatInfo?.kind === "person" && room?.online && !seatInfo.uid;
    const away = !invited && seatInfo?.kind === "person" && room?.online && room.present && !room.present.includes(game.players.indexOf(p));
    el.querySelector(".name").textContent = nameOf(p);
    el.querySelector(".count").textContent = invited ? t("seatInvited") : away ? `${t("tiles", p.rack.length)} · ${t("seatAway")}` : t("tiles", p.rack.length);
    el.querySelector(".said").textContent = say(p.said);
    // Face down while the game is on; face up once it is over.
    el.querySelector(".hand").replaceChildren(...p.rack.map(id => game.over ? tileEl(id) : backEl()));
  }
  const bottom = $("#seat-bottom");
  bottom.hidden = false;
  bottom.classList.toggle("active", mine);
  bottom.querySelector(".name").textContent = t("you");
  // Your own draw for who starts isn't news to you.
  bottom.querySelector(".said").textContent = say(view.mySaid ?? (me().said?.[0] === "picked" ? null : me().said));
  $("#observing").hidden = !ui.observing;

  const table = $("#table");
  table.replaceChildren();
  const shown = shownTable();
  shown.forEach((set, i) => {
    const el = document.createElement("div"), a = analyse(set);
    el.className = "set";
    el.dataset.set = i;
    if (!a) el.classList.add("bad");
    if (mine && !me().melded && set.some(id => !placed.has(id))) el.classList.add("locked");
    set.forEach((id, j) => {
      const tile = tileEl(id, a?.reps[j]);
      if (placed.has(id)) tile.classList.add("mine");
      if (view.recent.has(id)) tile.classList.add("recent");
      if (ui.selected.has(id)) tile.classList.add("sel");
      if (canMove(id)) tile.classList.add("can");
      el.append(tile);
    });
    table.append(el);
  });
  if (mine && !ui.observing) {
    const el = document.createElement("div");
    el.className = "newset";
    el.textContent = "+ " + t("newSet");
    table.append(el);
  } else if (!shown.length) {
    const el = document.createElement("div");
    el.className = "empty-table";
    el.textContent = t("emptyTable");
    table.append(el);
  }

  $("#rack").replaceChildren(...view.rack.map(id => {
    const tile = tileEl(id);
    if (id === view.drawn) tile.classList.add("new");
    if (ui.selected.has(id)) tile.classList.add("sel");
    if (!game.over && !ui.observing) tile.classList.add("can");
    return tile;
  }));

  const go = $("#go");
  go.textContent = placed.size ? t("done") : game.pool.length ? t("draw") : t("pass");
  go.disabled = !canAct();
  $("#reset").disabled = !canAct() || (!placed.size && !tableChanged());
  $("#sort-num").disabled = $("#sort-color").disabled = game.over || ui.observing;

  renderStatus();
  setTitle();
  showMenuItems();
  $("#pool").textContent = t("pool", game.pool.length);
  for (const b of document.querySelectorAll("[data-act=opp]")) b.setAttribute("aria-checked", Number(b.dataset.n) === game.players.length - 1);
  requestAnimationFrame(layoutHands);
}

function renderStatus() {
  const el = $("#status");
  if (Date.now() < ui.warnUntil) return;
  el.classList.remove("warn");
  let text = say(view.status);
  if (ui.offline) text = t("offline");
  else if (record.started === false) text = t("waitingToJoin");
  if (!text && myTurn()) {
    text = !me().melded ? t("yourFirst", meldPoints(shownTable(), [...placedNow()]))
         : game.pool.length ? t("yourTurn") : t("yourTurnEmpty");
  }
  if (!text && !game.over) text = t("theirTurn", nameOf(current()));
  el.textContent = text;
}

// A short warning in the status bar, for a move that isn't allowed.
function warn(key) {
  const el = $("#status");
  el.textContent = t(key);
  el.classList.add("warn");
  ui.warnUntil = Date.now() + 3500;
  later(() => { ui.warnUntil = 0; if (game) renderStatus(); }, 3600);
}

// The opponents' tiles overlap as much as they must to fit along their side.
function layoutHands() {
  for (const hand of document.querySelectorAll(".seat:not([hidden]) .hand")) {
    const tiles = [...hand.children];
    if (!tiles.length) continue;
    const vertical = hand.classList.contains("v");
    const w = tiles[0].offsetWidth, h = tiles[0].offsetHeight;
    const room = vertical ? hand.clientHeight : hand.clientWidth;
    const step = tiles.length > 1 ? Math.max(3, Math.min(w + 2, (room - w) / (tiles.length - 1))) : 0;
    const start = Math.max(0, (room - (step * (tiles.length - 1) + w)) / 2);
    tiles.forEach((tile, i) => {
      if (vertical) {
        // Turned a quarter, a tile is w tall and h wide; place its box so that shows where it should.
        tile.style.left = `${(hand.clientWidth - w) / 2}px`;
        tile.style.top = `${start + i * step + (w - h) / 2}px`;
      } else {
        tile.style.left = `${start + i * step}px`;
        tile.style.top = "0";
      }
    });
  }
}
addEventListener("resize", () => requestAnimationFrame(layoutHands));

// --- the clock -----------------------------------------------------------------

let clockTimer = 0;
function startClock() {
  stopClock();
  if (!settings.timer || room?.online) return;       // online, each browser could only time itself
  view.deadline = Date.now() + TURN_SECONDS * 1000;
  const tick = () => {
    const left = Math.max(0, Math.ceil((view.deadline - Date.now()) / 1000));
    $("#clock").textContent = `⏱ ${left}`;
    if (left <= 0) { stopClock(); timeUp(); }
  };
  $("#clock").hidden = false;
  tick();
  clockTimer = setInterval(tick, 250);
}
function stopClock() {
  clearInterval(clockTimer);
  clockTimer = 0;
  $("#clock").hidden = true;
}

// --- dragging and tapping tiles ----------------------------------------------------

// Where a point on the page would drop tiles: on a set, the new-set box or the
// table (a new set), or your rack.
function targetAt(x, y, ids) {
  const el = document.elementFromPoint(x, y);
  if (!el) return null;
  const set = el.closest(".set");
  if (set) return {set: Number(set.dataset.set), at: indexAt(set, x, y, ids), el: set};
  if (el.closest(".newset, #table")) return myTurn() ? {set: "new", el: $(".newset")} : null;
  if (el.closest("#seat-bottom")) return {rack: true, at: indexAt($("#rack"), x, y, ids), el: $("#rack")};
  return null;
}
// The place among the tiles in a box (leaving out those being moved) that a
// point is at, reading the rows like text.
function indexAt(box, x, y, ids) {
  const tiles = [...box.querySelectorAll(".tile")].filter(el => !ids.includes(Number(el.dataset.id)));
  const i = tiles.findIndex(el => {
    const r = el.getBoundingClientRect();
    return y < r.top || (y <= r.bottom && x < r.left + r.width / 2);
  });
  return i < 0 ? tiles.length : i;
}

const tabletop = $("#tabletop");
tabletop.addEventListener("pointerdown", e => {
  if (e.button !== 0 || !game || !$("#layer").hidden) return;
  const tile = e.target.closest(".tile[data-id]");
  if (!tile || !tile.closest("#rack, #table")) return;
  const id = Number(tile.dataset.id);
  if (!canMove(id)) return;
  e.preventDefault();
  ui.press = {id, x: e.clientX, y: e.clientY, pointerId: e.pointerId, dragging: false};
});
addEventListener("pointermove", e => {
  const press = ui.press;
  if (!press || e.pointerId !== press.pointerId) return;
  if (!press.dragging) {
    if (Math.hypot(e.clientX - press.x, e.clientY - press.y) < 6) return;
    startDrag(press);
  }
  press.ghost.style.left = `${e.clientX - press.dx}px`;
  press.ghost.style.top = `${e.clientY - press.dy}px`;
  const target = targetAt(e.clientX, e.clientY, press.ids);
  if (target?.el !== press.over) {
    press.over?.classList.remove("over");
    press.over = target?.el ?? null;
    press.over?.classList.add("over");
  }
});
addEventListener("pointerup", e => {
  const press = ui.press;
  if (!press || e.pointerId !== press.pointerId) return;
  ui.press = null;
  if (!press.dragging) { toggleSelected(press.id); return; }
  endDrag(press);
  const target = targetAt(e.clientX, e.clientY, press.ids);
  if (target) moveTiles(press.ids, target);
  else render();
});
addEventListener("pointercancel", e => {
  const press = ui.press;
  if (!press || e.pointerId !== press.pointerId) return;
  ui.press = null;
  if (press.dragging) { endDrag(press); render(); }
});

function startDrag(press) {
  press.dragging = true;
  // Drag everything selected if the tile is selected, else just this one.
  const selected = [...document.querySelectorAll(".tile.sel")].map(el => Number(el.dataset.id));
  press.ids = ui.selected.has(press.id) ? selected.filter(canMove) : [press.id];
  const ghost = document.createElement("div");
  ghost.className = "ghost";
  for (const id of press.ids) ghost.append(tileEl(id));
  document.body.append(ghost);
  const grabbed = document.querySelector(`.tile[data-id="${press.id}"]`).getBoundingClientRect();
  const width = parseFloat(getComputedStyle(ghost.firstChild).width);
  press.dx = (press.x - grabbed.left) * width / grabbed.width + press.ids.indexOf(press.id) * (width + 2);
  press.dy = (press.y - grabbed.top) * width / grabbed.width;
  press.ghost = ghost;
  for (const id of press.ids) document.querySelector(`.tile[data-id="${id}"]`)?.classList.add("dragging");
}
function endDrag(press) {
  press.ghost.remove();
  press.over?.classList.remove("over");
  for (const el of document.querySelectorAll(".tile.dragging")) el.classList.remove("dragging");
}

function toggleSelected(id) {
  if (ui.selected.has(id)) ui.selected.delete(id); else ui.selected.add(id);
  document.querySelector(`.tile[data-id="${id}"]`)?.classList.toggle("sel", ui.selected.has(id));
}

// A tap next to the tiles: put the selected tiles there, or else let go of them.
tabletop.addEventListener("click", e => {
  if (!game || e.target.closest(".tile")) return;
  if (!ui.selected.size) return;
  const ids = [...document.querySelectorAll(".tile.sel")].map(el => Number(el.dataset.id)).filter(canMove);
  const target = e.target.closest(".set, .newset, #rack") ? targetAt(e.clientX, e.clientY, ids) : null;
  if (target && ids.length) {
    moveTiles(ids, target.rack || target.set === "new" ? target : {...target, at: Infinity});
  } else {
    ui.selected.clear();
    render();
  }
});

let onEscape = null;
function dialog(title, body, buttons, wide = false) {
  const layer = $("#layer");
  const box = document.createElement("div");
  box.className = "dialog" + (wide ? " wide" : "");
  box.setAttribute("role", "dialog");
  box.setAttribute("aria-modal", "true");
  box.innerHTML = `<div class="head"><span class="caption"></span><button type="button" class="close" aria-label="${t("close")}">✕</button></div><div class="body"></div><div class="buttons"></div>`;
  box.querySelector(".caption").textContent = title;
  const content = box.querySelector(".body");
  if (typeof body === "string") content.innerHTML = body; else content.append(body);
  const row = box.querySelector(".buttons");
  for (const b of buttons) {
    const el = document.createElement("button");
    el.type = "button";
    el.className = "btn" + (b.default ? " default" : "");
    el.textContent = b.label;
    el.addEventListener("click", () => { closeDialog(); b.action?.(); });
    row.append(el);
  }
  const cancel = buttons.find(b => b.cancel) ?? buttons[buttons.length - 1];
  onEscape = () => { closeDialog(); cancel.action?.(); };
  box.querySelector(".close").addEventListener("click", onEscape);
  layer.replaceChildren(box);
  layer.hidden = false;
  (row.querySelector(".default") ?? row.firstChild)?.focus();
}
function closeDialog() {
  $("#layer").hidden = true;
  $("#layer").replaceChildren();
  onEscape = null;
}
function message(text) {
  dialog("Tile Rummy", "<p></p>", [{label: t("ok"), default: true}]);

}

function showScores(result) {
  if (!game) return;
  const box = document.createElement("div");
  if (result) {
    const p = document.createElement("p");
    p.className = "result";
    p.textContent = say(result);
    box.append(p);
  }
  const sheet = game.sheet;
  if (!sheet.length) {
    box.append(t("noGames"));
  } else {
    const table = document.createElement("table");

    const names = game.players.map(p => nameOf(p) ?? t("you"));
    const cell = (tag, text, cls) => { const c = document.createElement(tag); c.textContent = text; if (cls) c.className = cls; return c; };
    const row = (cells) => { const tr = document.createElement("tr"); tr.append(...cells); return tr; };
    const signed = n => n > 0 ? `+${n}` : String(n);
    const head = document.createElement("thead"), body = document.createElement("tbody"), foot = document.createElement("tfoot");
    head.append(row([cell("th", ""), ...names.map(n => cell("th", n))]));

      ...g.points.map((n, j) => cell("td", signed(n), j === g.winner ? "win" : n < 0 ? "neg" : ""))])));
    foot.append(row([cell("td", t("total")), ...names.map((_, j) => cell("td", signed(sheet.reduce((s, g) => s + g.points[j], 0))))]));
    foot.append(row([cell("td", t("wins")), ...names.map((_, j) => cell("td", String(sheet.filter(g => g.winner === j).length)))]));

function askDeleteFinished(finished) {
