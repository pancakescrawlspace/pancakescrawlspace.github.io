  <g transform="translate(256 256) scale(.8) translate(-256 -256)" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="150" text-anchor="middle">
    <g transform="rotate(-10 180 270)">
      <rect x="92" y="150" width="176" height="236" rx="24" fill="#fdfdfb" stroke="#b9b5ab" stroke-width="6"/>
      <text x="180" y="320" fill="#1646b8">7</text>
    </g>
    <g transform="rotate(8 332 262)">
      <rect x="244" y="144" width="176" height="236" rx="24" fill="#fdfdfb" stroke="#b9b5ab" stroke-width="6"/>
      <text x="332" y="314" fill="#c8141e">8</text>
    </g>
  </g>
</svg>
