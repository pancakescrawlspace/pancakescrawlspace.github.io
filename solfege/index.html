<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>solfège</title>
<!-- Installing it as an app, and the icons; sw.js keeps it for offline use. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161614" media="(prefers-color-scheme: dark)">
<style>
  :root {
    --bg: #f7f6f2;
    --panel: #ffffff;
    --text: #1d1c1a;
    --muted: #6d6a63;
    --line: #dedbd3;
    --accent: #2f5fb3;
    --accent-soft: #e3ebf9;
    --accent-text: #ffffff;
    --yes: #23753a;
    --yes-soft: #dcefe0;
    --no: #b3372f;
    --no-soft: #f8e0dd;
    --key-white: #fdfdfb;
    --key-black: #2a2926;
    --key-line: #b9b5ab;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161614;
      --panel: #201f1d;
      --text: #ebe9e4;
      --muted: #9a968d;
      --line: #36342f;
      --accent: #7aa2ec;
      --accent-soft: #233150;
      --accent-text: #10131a;
      --yes: #6fcf87;
      --yes-soft: #1f3a26;
      --no: #f08a80;
      --no-soft: #43231f;
      --key-white: #e9e7e1;
      --key-black: #0d0d0c;
      --key-line: #4a4741;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 46rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; }
  h1 { font-size: 1.6rem; margin: 0; letter-spacing: .02em; }
  h2 { font-size: 1rem; margin: 0 0 .5rem; }
  .lede { margin: .25rem 0 1.25rem; color: var(--muted); }
  .muted { color: var(--muted); }
  .small { font-size: .9rem; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 1rem;
    margin-bottom: 1rem;
  }
  input, select, button { font: inherit; color: inherit; }
  button {
    padding: .5rem .95rem;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--muted); }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  kbd {
    font: .75em ui-monospace, monospace;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 0 .3em;
    margin-left: .35em;
  }
  button.primary kbd { color: inherit; border-color: currentColor; opacity: .7; }
  code { font: .92em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  /* the score and the language */
  .top { position: relative; display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; font-size: .9rem; }
  #score { display: contents; }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .lang button { border: none; border-radius: 0; padding: .15rem .6rem; background: var(--panel); color: var(--muted); }
  .lang button + button { border-left: 1px solid var(--line); }
  .lang button[aria-pressed=true] { background: var(--accent); color: var(--accent-text); font-weight: 600; }
  .chip { padding: .15rem .6rem; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); cursor: help; }
  .chip b { font-variant-numeric: tabular-nums; }
  .chip .icon { display: none; width: 1em; height: 1em; vertical-align: -.15em; margin-right: .2em;
                fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .chip .icon.first { stroke: var(--yes); }
  .chip .icon.later { stroke: var(--accent); }
  .chip .icon.shown { stroke: var(--no); }
  /* a tooltip under the row, at its right edge, so it stays on the screen */
  .tip {
    position: absolute; top: calc(100% + .4rem); right: 0; z-index: 2;
    width: max-content; max-width: min(16rem, calc(100vw - 2rem));
    padding: .4rem .6rem; border-radius: 6px; background: var(--text); color: var(--bg);
    font-size: .85rem; line-height: 1.35; box-shadow: 0 2px 8px rgb(0 0 0 / .2);
  }
  /* on smaller screens, an icon and the number instead of the words */
  @media (max-width: 40rem) {
    .chip { padding: .15rem .5rem; }
    .chip .icon { display: inline-block; }
    .chip .label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  }

  /* the round */
  #stage { text-align: center; padding: 1.5rem 1rem; }
  .round { color: var(--muted); font-size: .9rem; margin: 0; }
  .start-note { font-size: 2.6rem; font-weight: 700; line-height: 1.1; margin: .25rem 0; }
  .start-label { color: var(--muted); margin: 0 0 1rem; }
  .play { display: flex; gap: .5rem; justify-content: center; flex-wrap: wrap; }
  .play .big { font-size: 1.1rem; padding: .7rem 1.4rem; }
  #feedback { min-height: 3.2rem; margin: 1rem 0 0; }
  #feedback .title { font-weight: 700; font-size: 1.15rem; }
  #feedback.yes .title { color: var(--yes); }
  #feedback.no .title { color: var(--no); }
  #notice { margin: .5rem 0 0; }

  /* answering */
  .tabs { display: flex; gap: .25rem; border-bottom: 1px solid var(--line); margin: -.25rem 0 1rem; }
  .tabs button {
    border: none; border-bottom: 2px solid transparent; border-radius: 0;
    background: none; padding: .5rem .8rem; color: var(--muted);
  }
  .tabs button[aria-selected=true] { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }

  .keyboard-scroll { overflow-x: auto; padding-bottom: .25rem; }
  .keyboard {
    --key-min: 1.9rem;
    position: relative; display: flex; height: 9.5rem; user-select: none; -webkit-user-select: none;
    min-width: calc(var(--whites) * var(--key-min));
  }
  @media (max-width: 34rem) {
    .keyboard { --key-min: 1.25rem; height: 8rem; }
    .key.white { font-size: .6rem; }
    .play .big { font-size: 1rem; padding: .6rem 1rem; }
  }
  @media (hover: none) {
    kbd { display: none; }
  }
  .key { padding: 0; border-radius: 0 0 6px 6px; touch-action: manipulation; transition: background-color .3s, border-color .3s; }
  .key.white {
    flex: 1; min-width: var(--key-min);
    background: var(--key-white); border: 1px solid var(--key-line); margin-right: -1px;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
    padding-bottom: .4rem; color: #55524b; font-size: .72rem;
  }
  .key.black {
    position: absolute; top: 0; height: 60%; z-index: 1;
    background: var(--key-black); border: 1px solid var(--key-black);
  }
  /* only with a mouse: on a touch screen a tapped key would keep it */
  @media (hover: hover) {
    .key:hover:not(:disabled) { border-color: var(--key-line); filter: brightness(.94); }
    .key.black:hover { filter: brightness(1.6); }
  }
  .key.start::before {
    content: ""; width: .55rem; height: .55rem; border-radius: 50%;
    background: var(--accent); margin-bottom: .3rem;
  }
  .key.black.start::before { display: block; margin: auto auto .5rem; }
  .key.black.start { display: flex; }
  .key.wrong { background: var(--no) !important; border-color: var(--no) !important; color: #fff; }
  .key.right { background: var(--yes) !important; border-color: var(--yes) !important; color: #fff; }
  .legend { margin: .6rem 0 0; }
  .legend .dot { display: inline-block; width: .55rem; height: .55rem; border-radius: 50%; background: var(--accent); }

  .intervals h3 { font-size: .9rem; color: var(--muted); font-weight: 600; margin: 0 0 .4rem; }
  .intervals .group + .group { margin-top: 1rem; }
  .interval-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(7.5rem, 1fr)); gap: .4rem; }
  .interval-grid button { text-align: left; line-height: 1.25; padding: .45rem .6rem; }
  .interval-grid b { display: block; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .interval-grid span { font-size: .8rem; color: var(--muted); }
  .interval-grid button.wrong { background: var(--no-soft); border-color: var(--no); }
  .interval-grid button.right { background: var(--yes-soft); border-color: var(--yes); }

  #type-form { display: flex; gap: .5rem; }
  #answer {
    flex: 1; min-width: 0;
    padding: .5rem .6rem;
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .syntax { margin: .75rem 0 0; padding-left: 1.1rem; }
  .syntax li + li { margin-top: .35rem; }

  /* history */
  #history { list-style: none; margin: 0; padding: 0; }
  #history li {
    display: grid; grid-template-columns: 1fr auto; gap: .1rem 1rem;
    padding: .45rem 0; border-top: 1px solid var(--line);
  }
  #history li:first-child { border-top: none; }
  #history .what { font-weight: 600; }
  #history .how { color: var(--muted); font-size: .9rem; grid-column: 1; }
  #history .result { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-size: .85rem; padding: .1rem .55rem; border-radius: 999px; }
  #history .result.first { background: var(--yes-soft); color: var(--yes); }
  #history .result.later { background: var(--accent-soft); color: var(--accent); }
  #history .result.shown { background: var(--no-soft); color: var(--no); }

  /* settings */
  summary { cursor: pointer; font-weight: 600; }
  .fields {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(13rem, 1fr));
    gap: .75rem 1rem;
    margin-top: .75rem;
  }
  label { display: block; font-size: .9rem; color: var(--muted); }
  label.check { display: flex; gap: .5rem; align-items: center; color: var(--text); font-size: 1rem; }
  .fields input[type=text], .fields input[type=number], .fields select {
    display: block; width: 100%; margin-top: .2rem; padding: .4rem .5rem;
    background: var(--bg); border: 1px solid var(--line); border-radius: 6px;
  }
  .actions { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; margin-top: 1rem; }
  .error { color: var(--no); }
  /* installing it as an app */
  .install { display: flex; gap: .5rem .75rem; align-items: center; margin: -.5rem 0 1rem; }
  .install .text { flex: 1; }
  .install .hide { border: none; background: none; padding: .2rem .5rem; color: var(--muted); font-size: 1.2rem; line-height: 1; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>solfège</h1>
    <div class="top">
      <div id="score" hidden>
        <button type="button" class="chip" aria-describedby="tip-first"><svg class="icon first" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5 6.5 12 13 4.5"/></svg><b id="score-first">0</b> <span class="label" data-t="scoreFirst"></span></button>
        <button type="button" class="chip" aria-describedby="tip-later"><svg class="icon later" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M12.5 1.5v3h-3"/></svg><b id="score-later">0</b> <span class="label" data-t="scoreLater"></span></button>
        <button type="button" class="chip" aria-describedby="tip-shown"><svg class="icon shown" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8Z"/><circle cx="8" cy="8" r="2"/></svg><b id="score-shown">0</b> <span class="label" data-t="scoreShown"></span></button>
      </div>
      <span class="tip" id="tip-first" role="tooltip" data-t="tipFirst" hidden></span>
      <span class="tip" id="tip-later" role="tooltip" data-t="tipLater" hidden></span>
      <span class="tip" id="tip-shown" role="tooltip" data-t="tipShown" hidden></span>
      <div class="lang" role="group" aria-label="Taal / Language">
        <button type="button" data-lang="nl" lang="nl" title="Nederlands">NL</button>
        <button type="button" data-lang="en" lang="en" title="English">EN</button>
      </div>
    </div>
  </header>
  <p class="lede" data-t="lede"></p>
  <div id="install" class="install small" hidden>
    <button type="button" class="primary" id="install-button" data-t="installButton" hidden></button>
    <span class="text muted" id="install-ios" data-t="installIos" hidden></span>
    <button type="button" class="hide" id="install-hide">×</button>
  </div>

  <section id="welcome" class="panel">
    <p style="margin-top: 0" data-t="welcome"></p>
    <p class="muted small" data-t="welcomeSettings"></p>
    <button type="button" class="primary big" id="welcome-start" data-t="start"></button>
  </section>

  <div id="playing" hidden>
    <section id="stage" class="panel">
      <p class="round" id="round"></p>
      <p class="start-note" id="start-note"></p>
      <p class="start-label" id="start-label"></p>
      <div class="play">
        <button type="button" class="primary big" id="play-both" data-t="playBoth"></button>
        <button type="button" class="big" id="play-second" data-t="playSecond"></button>
        <button type="button" class="big" id="give-up" data-t="giveUp"></button>
        <button type="button" class="primary big" id="next" data-t="next" hidden></button>
      </div>
      <div id="feedback" role="status" aria-live="polite"></div>
      <p id="notice" class="muted small" hidden></p>
    </section>

    <section class="panel">
      <div class="tabs" role="tablist">
        <button type="button" role="tab" data-tab="keys" aria-selected="true" data-t="tabKeys"></button>
        <button type="button" role="tab" data-tab="intervals" aria-selected="false" data-t="tabIntervals"></button>
        <button type="button" role="tab" data-tab="type" aria-selected="false" data-t="tabType"></button>
      </div>

      <div data-panel="keys" role="tabpanel">
        <div class="keyboard-scroll"><div class="keyboard" id="keyboard"></div></div>
        <p class="legend muted small" data-t="legend"></p>
      </div>

      <div data-panel="intervals" role="tabpanel" class="intervals" id="intervals" hidden></div>

      <div data-panel="type" role="tabpanel" hidden>
        <form id="type-form" autocomplete="off">
          <input type="text" id="answer" placeholder="sol, fis, eb5, 3-, -5 …"
                 autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="send">
          <button type="submit" class="primary" data-t="check"></button>
        </form>
        <ul class="syntax small">
          <li data-t="syntaxNote"></li>
          <li data-t="syntaxInterval"></li>
          <li data-t="syntaxDirection"></li>
          <li data-t="syntaxCommands"></li>
        </ul>
      </div>
    </section>

    <section class="panel" id="history-panel" hidden>
      <h2 data-t="soFar"></h2>
      <ul id="history"></ul>
    </section>
  </div>

  <form id="options" class="panel">
    <details id="options-details">
      <summary data-t="settings"></summary>
      <div class="fields">
        <label><span data-t="optStart"></span>
          <input type="text" id="opt-start" value="c4" autocomplete="off" autocapitalize="off" spellcheck="false">
        </label>
        <label><span data-t="optRange"></span>
          <input type="number" id="opt-range" value="12" min="1" max="24">
        </label>
        <label><span data-t="optSound"></span>
          <select id="opt-sound">
            <option value="piano" data-t="optSamples"></option>
            <option value="synth" data-t="optSynth"></option>
          </select>
        </label>
        <label><span data-t="optInstrument"></span>
          <select id="opt-program"></select>
        </label>
        <label><span data-t="optSeed"></span>
          <input type="number" id="opt-seed" step="1">
        </label>
        <div>
          <label class="check"><input type="checkbox" id="opt-up"> <span data-t="optUp"></span></label>
          <label class="check"><input type="checkbox" id="opt-chromatic"> <span data-t="optChromatic"></span></label>
        </div>
      </div>
      <p class="muted small" style="margin: .75rem 0 0" data-t="optHelp"></p>
      <div class="actions">
        <button type="submit" class="primary" id="start-button"></button>
        <span id="options-error" class="error" role="alert"></span>
      </div>
    </details>
  </form>
</main>

<script>
"use strict";

const MIDDLE_C = 60;
const PIANO = [21, 108];                   // A0 .. C8
const RANDOM_STARTS = [53, 67];            // F3 .. G4
const RATE = 44100;
const SYNTH_LEVEL = 0.25;      // peak of the built-in tone
const SAMPLE_LEVEL = 2.5;      // the samples peak near -20 dB; this brings them up to the built-in tone
const TAIL = 1.0;              // seconds a note sounds on after it is released
const SAMPLES = "https://gleitz.github.io/midi-js-soundfonts/FluidR3_GM/";

// General MIDI programs, as the sample set names them.
const INSTRUMENTS = (
  "acoustic_grand_piano bright_acoustic_piano electric_grand_piano honkytonk_piano " +
  "electric_piano_1 electric_piano_2 harpsichord clavinet celesta glockenspiel music_box " +
  "vibraphone marimba xylophone tubular_bells dulcimer drawbar_organ percussive_organ " +
  "rock_organ church_organ reed_organ accordion harmonica tango_accordion " +
  "acoustic_guitar_nylon acoustic_guitar_steel electric_guitar_jazz electric_guitar_clean " +
  "electric_guitar_muted overdriven_guitar distortion_guitar guitar_harmonics acoustic_bass " +
  "electric_bass_finger electric_bass_pick fretless_bass slap_bass_1 slap_bass_2 " +
  "synth_bass_1 synth_bass_2 violin viola cello contrabass tremolo_strings " +
  "pizzicato_strings orchestral_harp timpani string_ensemble_1 string_ensemble_2 " +
  "synth_strings_1 synth_strings_2 choir_aahs voice_oohs synth_choir orchestra_hit trumpet " +
  "trombone tuba muted_trumpet french_horn brass_section synth_brass_1 synth_brass_2 " +
  "soprano_sax alto_sax tenor_sax baritone_sax oboe english_horn bassoon clarinet piccolo " +
  "flute recorder pan_flute blown_bottle shakuhachi whistle ocarina lead_1_square " +
  "lead_2_sawtooth lead_3_calliope lead_4_chiff lead_5_charang lead_6_voice lead_7_fifths " +
  "lead_8_bass__lead pad_1_new_age pad_2_warm pad_3_polysynth pad_4_choir pad_5_bowed " +
  "pad_6_metallic pad_7_halo pad_8_sweep fx_1_rain fx_2_soundtrack fx_3_crystal " +
  "fx_4_atmosphere fx_5_brightness fx_6_goblins fx_7_echoes fx_8_scifi sitar banjo " +
  "shamisen koto kalimba bagpipe fiddle shanai tinkle_bell agogo steel_drums woodblock " +
  "taiko_drum melodic_tom synth_drum reverse_cymbal guitar_fret_noise breath_noise " +
  "seashore bird_tweet telephone_ring helicopter applause gunshot").split(" ");

const range = (lo, hi) => Array.from({length: hi - lo + 1}, (_, i) => lo + i);
const mod = (a, n) => ((a % n) + n) % n;
const normalize = text => text.trim().toLowerCase().replaceAll(" ", "");

// --- languages ---------------------------------------------------------------

// The page's text in Dutch (the default) and English. Strings that hold markup
// go into the page as HTML; functions take the parts that vary.
const STRINGS = {
  nl: {
    scoreFirst: "in één keer",
    scoreLater: "na meer pogingen",
    scoreShown: "getoond",
    lede: "Luister naar een beginnoot en daarna een andere noot. Welke noot was de tweede?",
    welcome: `Elke ronde klinkt eerst de beginnoot en dan een tweede noot in de buurt. Antwoord door de tweede
      noot op het klavier in te drukken, door het interval tussen de twee te kiezen of door de naam te typen.
      Is het goed, dan begint de volgende ronde.`,
    welcomeSettings: `Met de instellingen hieronder kies je de beginnoot, hoe ver de tweede noot ervan af kan
      liggen en het geluid.`,
    start: "Start",
    startOver: "Opnieuw beginnen",
    playBoth: "Speel beide <kbd>Spatie</kbd>",
    playSecond: "Tweede noot <kbd>P</kbd>",
    giveUp: "Toon antwoord <kbd>S</kbd>",
    next: "Volgende noot <kbd>N</kbd>",
    tabKeys: "Klavier",
    tabIntervals: "Interval",
    tabType: "Typen",
    legend: `<span class="dot"></span> de beginnoot. Een toets laat zijn noot horen en antwoordt met precies die
      noot. Zonder alle twaalf noten antwoorden alleen de toetsen uit de toonladder van de beginnoot; de andere
      laten alleen hun noot horen.`,
    answerLabel: "Noot of interval",
    check: "Controleer",
    syntaxNote: `<b>Een noot:</b> <code>fis</code>, <code>bes</code>, <code>es</code>, <code>as</code> enzovoort,
      <code>c d e f g a b</code> met <code>#</code> of <code>b</code>, of de vaste do: <code>do re mi fa sol la
      si</code>. Elk octaaf telt. Wil je precies zijn, zet het octaaf erachter: <code>d4</code>,
      <code>eb5</code> (de centrale C is <code>c4</code>), of zoals in LilyPond <code>d'</code>,
      <code>bes,</code>.`,
    syntaxInterval: `<b>Een interval</b> vanaf de beginnoot: <code>2</code> is een grote secunde, <code>2-</code>
      een kleine secunde, <code>4+</code> of <code>5-</code> de tritonus, <code>8</code> een octaaf. Bij 1, 4, 5
      en 8 betekenen <code>+</code> en <code>-</code> overmatig en verminderd; bij de andere is <code>-</code>
      klein, <code>--</code> verminderd en <code>+</code> overmatig.`,
    syntaxDirection: `<b>Een richting:</b> <code>+</code> of <code>-</code> vooraan betekent omhoog of omlaag, dus

let lang = "nl";
try {
  const saved = localStorage.getItem("solfege.lang");
  if (saved && Object.hasOwn(STRINGS, saved)) lang = saved;
} catch {}

function t(key, ...args) {
  const text = STRINGS[lang][key];
  return typeof text === "function" ? text(...args) : text;
}

// --- parsing answers ---------------------------------------------------------

const LETTERS = new Map(Object.entries({c: 0, d: 2, e: 4, f: 5, g: 7, a: 9, b: 11}));
const SYLLABLES = new Map(Object.entries({do: 0, ut: 0, re: 2, mi: 4, fa: 5, sol: 7, so: 7,
                                          la: 9, si: 11, ti: 11}));
const ACCIDENTALS = new Map(Object.entries({"": 0, "#": 1, "♯": 1, "##": 2, x: 2, is: 1, isis: 2,
                                            b: -1, "♭": -1, bb: -2, es: -1, eses: -2}));
const SHORT_FLATS = new Map(Object.entries({s: -1, ses: -2}));   // Dutch/German as, es, ases, eses

const NOTE_RE = /^(do|ut|re|mi|fa|sol|so|la|si|ti|[a-g])([^\d',-]*)(-?\d+|'*|,*)$/u;
const INTERVAL_RE = /^([+-]?)(\d+)(\++|-+|)$/;

const MAJOR_SCALE = [0, 2, 4, 5, 7, 9, 11];

// Return [pitch class, midi number or null], or null if not a note.
function parseNote(text) {
  const m = NOTE_RE.exec(text);
  if (!m) return null;
  const [, name, acc] = m;
  let octave = m[3];
  const base = SYLLABLES.has(name) ? SYLLABLES.get(name) : LETTERS.get(name);
  let alter;
  if (ACCIDENTALS.has(acc)) {
    alter = ACCIDENTALS.get(acc);
  } else if ((name === "a" || name === "e") && SHORT_FLATS.has(acc)) {
    alter = SHORT_FLATS.get(acc);
  } else {
    return null;
  }
  const pc = mod(base + alter, 12);
  if (!octave) return [pc, null];
  if ("',".includes(octave[0])) {           // LilyPond: c = C3, c' = C4
    octave = 3 + octave.split("'").length - octave.split(",").length;
  } else {
    octave = parseInt(octave, 10);
  }
  return [pc, 12 * (octave + 1) + base + alter];
}

// Return [semitones, direction] with direction 1, -1 or null.
function parseInterval(text) {
  const m = INTERVAL_RE.exec(text);
  if (!m) return null;
  const [, sign, number, mods] = m;
  const n = parseInt(number, 10);
  if (n < 1) return null;
  const degree = (n - 1) % 7, octaves = Math.floor((n - 1) / 7);
  let semis = MAJOR_SCALE[degree] + 12 * octaves;
  if (mods.startsWith("+")) {
    semis += mods.length;
  } else if (mods) {
    semis -= mods.length;
  }
  if (semis < 0) return null;
  return [semis, {"+": 1, "-": -1, "": null}[sign]];
}

// --- naming ------------------------------------------------------------------

const SHARPS = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const FLATS = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];
const SIMPLE = [[1, ""], [2, "-"], [2, ""], [3, "-"], [3, ""], [4, ""], [4, "+"], [5, ""],
                [6, "-"], [6, ""], [7, "-"], [7, ""]];

function noteName(midi) {
  const octave = Math.floor(midi / 12), pc = midi % 12;
  const names = [...new Set([SHARPS[pc], FLATS[pc]])];
  return names.map(n => `${n}${octave - 1}`).join(" / ");
}

// The parts of an interval's name: its answer ("6-"), its short name
// ("6-", or "4+ = 5-" for the tritone) and its name in words.
function intervalParts(semis) {
  const octaves = Math.floor(Math.abs(semis) / 12), rest = Math.abs(semis) % 12;
  let [n, mod] = SIMPLE[rest];
  n += 7 * octaves;
  let quality;
  if ([0, 3, 4].includes((n - 1) % 7)) {
    quality = t(mod ? "augmented" : "perfect");
  } else {
    quality = t(mod ? "minor" : "major");
  }
  const ordinal = t("ordinals")[n];
  let words = [1, 8, 15].includes(n) ? ordinal : `${quality} ${ordinal}`;
  let short = `${n}${mod}`;
  if (rest === 6) {
    short += ` = ${n + 1}-`;
    words += `, ${t("tritone")}`;
  }
  return {answer: `${n}${mod}`, short, words};
}

function intervalName(semis) {
  const {short, words} = intervalParts(semis);
  return `${short} ${t(semis > 0 ? "up" : "down")} (${words})`;
}

// --- sound -------------------------------------------------------------------

// A plain piano-ish tone: decaying harmonics, fast decay after release.
function synth(notes, tail) {
  const total = Math.max(...notes.map(([, s, d]) => s + d + tail));
  const buf = new Float32Array(Math.floor(total * RATE) + 1);
  for (const [pitch, start, dur] of notes) {
    const f = 440 * 2 ** ((pitch - 69) / 12);
    const partials = [];
    for (let k = 1; k <= 8; k++) {
      if (f * k < RATE / 2.2) {
        partials.push([2 * Math.PI * f * k * (1 + 0.0004 * k * k) / RATE,
                       0.6 / k ** 1.3, 1.5 + 0.9 * k]);
      }
    }
    const first = Math.floor(start * RATE);
    const length = Math.floor((dur + tail) * RATE);
    for (let i = 0; i < length; i++) {
      const t = i / RATE;
      let env = Math.min(1, t * 400);
      if (t > dur) env *= Math.exp(-(t - dur) * 10);
      let sum = 0;
      for (const [w, a, d] of partials) sum += a * Math.exp(-t * d) * Math.sin(w * i);
      buf[first + i] += env * sum;
    }
  }
  let peak = 1e-9;
  for (const x of buf) peak = Math.max(peak, Math.abs(x));
  for (let i = 0; i < buf.length; i++) buf[i] = buf[i] / peak * SYNTH_LEVEL;
  return buf;
}

// The sample set names its files with flats: Db4, Bb3, ...
const sampleName = midi => FLATS[midi % 12] + (Math.floor(midi / 12) - 1);

class Sound {
  constructor(useSynth, program, onFallback) {
    this.ctx = new AudioContext();
    this.useSynth = useSynth;
    this.program = program;
    this.onFallback = onFallback;
    this.samples = new Map();
    this.rendered = new Map();
    this.out = null;
    this.token = 0;
  }

  sample(pitch) {
    if (!this.samples.has(pitch)) {
      const url = `${SAMPLES}${INSTRUMENTS[this.program]}-mp3/${sampleName(pitch)}.mp3`;
      this.samples.set(pitch, fetch(url).then(r => {
        if (!r.ok) throw new Error(`${url}: ${r.status}`);
        return r.arrayBuffer();
      }).then(data => this.ctx.decodeAudioData(data)));
    }
    return this.samples.get(pitch);
  }

  // Start loading samples in the background, so later rounds play at once.
  prefetch(pitches) {
    if (this.useSynth) return;
    for (const p of pitches) this.sample(p).catch(() => {});
  }

  synthBuffer(notes) {
    const key = JSON.stringify(notes);
    if (!this.rendered.has(key)) {
      const data = synth(notes, TAIL);
      const buffer = this.ctx.createBuffer(1, data.length, RATE);
      buffer.copyToChannel(data, 0);
      this.rendered.set(key, buffer);
    }
    return this.rendered.get(key);
  }

  async play(notes) {
    this.stop();
    const token = this.token;
    if (this.ctx.state === "suspended") this.ctx.resume();
    let voices;
    if (!this.useSynth) {
      try {
        const buffers = await Promise.all(notes.map(([p]) => this.sample(p)));
        voices = notes.map(([, start, dur], i) =>
          ({buffer: buffers[i], start, end: start + dur, level: SAMPLE_LEVEL}));
      } catch (e) {
        console.warn(e);
        if (token !== this.token) return;
        this.useSynth = true;
        this.onFallback();
      }
    }
    if (token !== this.token) return;        // stopped, or something else played meanwhile
    if (this.useSynth) {
      voices = [{buffer: this.synthBuffer(notes), start: 0, end: null, level: 1}];
    }
    const out = this.ctx.createGain();
    out.connect(this.ctx.destination);
    const t0 = this.ctx.currentTime + 0.03;
    for (const {buffer, start, end, level} of voices) {
      const src = this.ctx.createBufferSource();
      const gain = this.ctx.createGain();
      src.buffer = buffer;
      gain.gain.value = level;
      src.connect(gain).connect(out);
      src.start(t0 + start);
      if (end !== null) {                    // release, like a note-off
        gain.gain.setValueAtTime(level, t0 + end);
        gain.gain.setTargetAtTime(0, t0 + end, 0.1);
        src.stop(t0 + end + TAIL);
      }
    }
    this.out = out;
  }

  stop() {
    this.token++;
    if (!this.out) return;
    const out = this.out;
    out.gain.setTargetAtTime(0, this.ctx.currentTime, 0.01);
    setTimeout(() => out.disconnect(), 100);
    this.out = null;
  }
}

// --- the exercise ------------------------------------------------------------

// Return the midi number of a start note (in the octave from middle C up if
// none is given), null for "random", or undefined if it is neither.
function parseStart(text) {
  text = normalize(text);
  if (text === "willekeurig" || text === "random") return null;
  let note = parseNote(text);
  if (note && note[1] === null) note = parseNote(text + "4");
  return note ? note[1] : undefined;
}

// Return [correct, remark], the remark being a key of STRINGS.
function check(answer, target, start) {
  const dist = target - start;
  const iv = parseInterval(answer);
  if (iv !== null) {
    const [semis, direction] = iv;
    if (semis !== Math.abs(dist)) return [false, null];
    if (direction !== null && direction !== (dist > 0 ? 1 : -1)) {
      return [false, "wrongDirection"];
    }
    return [true, null];
  }
  const note = parseNote(answer);
  if (note !== null) {
    const [pc, midi] = note;
    if (pc !== target % 12) return [false, null];
    if (midi !== null && midi !== target) return [false, "wrongOctave"];
    return [true, null];
  }
  return [false, "notAnswer"];
}

// mulberry32: a small seeded generator, for the seed option.
function seeded(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// A white key from F3 to G4 (with chromatic, any key).
function startChoices(opts) {
  return range(...RANDOM_STARTS).filter(n => opts.chromatic || MAJOR_SCALE.includes(n % 12));
}

// Notes near the start note, from its major scale unless chromatic.
function candidates(opts, start) {
  return range(-opts.range, opts.range).filter(d =>
    d && !(opts.up && d < 0)
    && (opts.chromatic || MAJOR_SCALE.includes(mod(d, 12)))
    && start + d >= PIANO[0] && start + d <= PIANO[1]).map(d => start + d);
}

// Whether a note can be the answer's pitch class: any note with chromatic,
// otherwise one from the start note's major scale.
const inScale = (opts, start, pitch) => opts.chromatic || MAJOR_SCALE.includes(mod(pitch - start, 12));

// One session: the rounds, the score and what the page shows of them.
// A round is "asking" until it is answered ("right") or the answer is shown
// ("shown"); after "right" the next round starts by itself.
class Game {
  constructor(opts, sound) {
    this.opts = opts;
    this.sound = sound;
    this.random = opts.seed === null ? Math.random : seeded(opts.seed);
    this.randomStart = opts.start === null;
    this.start = opts.start;
    this.target = null;
    this.rounds = this.firstTime = this.later = this.givenUp = 0;
    this.phase = "asking";
    this.over = false;
    this.history = [];
  }

  choice(list) {
    return list[Math.floor(this.random() * list.length)];
  }

  begin() {
    renderScore(this);
    const playing = this.nextRound();
    const starts = this.randomStart ? startChoices(this.opts) : [this.start];
    const pitches = new Set(starts.flatMap(s => [s, ...candidates(this.opts, s)]));
    playing?.then(() => this.sound.prefetch(pitches));
  }

  nextRound() {
    if (this.over) return null;
    if (this.randomStart) this.start = this.choice(startChoices(this.opts));
    const choices = candidates(this.opts, this.start);
    if (choices.length > 1 && choices.includes(this.target)) {
      choices.splice(choices.indexOf(this.target), 1);
    }
    if (!choices.length) {
      this.over = true;
      showFeedback("no", () => t("noNotes"), () => t("widen", this.opts.chromatic));
      return null;
    }
    this.target = this.choice(choices);
    this.rounds++;
    this.tries = 0;
    this.phase = "asking";
    this.both = [[this.start, 0.0, 1.0], [this.target, 1.2, 1.4]];
    renderRound(this);
    return this.sound.play(this.both);
  }

  playBoth() { this.sound.play(this.both); }
  playSecond() { this.sound.play([[this.target, 0.0, 1.4]]); }

  // Check an answer; return true if it was right. el is the key or button it came from.
  answer(text, el) {
    if (this.phase !== "asking") return false;
    this.tries++;
    const [ok, remark] = check(normalize(text), this.target, this.start);
    if (!ok) {
      el?.classList.add("wrong");
      showFeedback("no", () => t("notThat"), () => remark ? capitalize(t(remark)) + "." : t("tryAgain"));
      return false;
    }
    this.phase = "right";
    if (this.tries === 1) this.firstTime++; else this.later++;
    el?.classList.add("right");
    markAnswer(this);
    const {start, target} = this;
    showFeedback("yes", () => t("right"), () => `${noteName(target)} · ${intervalName(target - start)}`);
    addHistory(this, this.tries === 1 ? "first" : "later");
    renderScore(this);
    setTimeout(() => this.nextRound(), 1000);
    return true;
  }

  giveUp() {
    if (this.phase !== "asking") return;
    this.phase = "shown";
    this.givenUp++;
    markAnswer(this);
    const {start, target} = this;
    showFeedback("", () => t("itWas", noteName(target)), () => intervalName(target - start));
    addHistory(this, "shown");
    renderScore(this);
    setButtons(this);
    this.playBoth();
  }

  next() {
    if (this.phase === "shown") this.nextRound();
  }

  end() {
    this.over = true;
    this.sound.stop();
  }
}

// --- the page ----------------------------------------------------------------

const $ = id => document.getElementById(id);
const capitalize = s => s[0].toUpperCase() + s.slice(1);
const isBlack = midi => [1, 3, 6, 8, 10].includes(midi % 12);
let game = null, sound = null;
let feedback = null;        // what the feedback box shows, kept to redraw it in another language
let optionsError = null;    // the key of the settings' error message

// title and detail are functions, so they can be drawn again in another language.
function showFeedback(kind, title, detail) {
  feedback = {kind, title, detail};
  drawFeedback();
}

function drawFeedback() {
  const box = $("feedback");
  box.className = feedback?.kind ?? "";
  box.replaceChildren();
  if (!feedback) return;
  const title = document.createElement("div");
  title.className = "title";
  title.textContent = feedback.title();
  const detail = document.createElement("div");
  detail.className = "muted";
  detail.textContent = feedback.detail();
  box.append(title, detail);
}

function renderScore(g) {
  $("score-first").textContent = g.firstTime;
  $("score-later").textContent = g.later;
  $("score-shown").textContent = g.givenUp;
}

function setButtons(g) {
  const shown = g.phase === "shown";
  $("next").hidden = !shown;
  $("give-up").hidden = shown;
}

function renderRound(g) {
  $("start-note").textContent = noteName(g.start);
  labelRound(g);
  feedback = null;
  drawFeedback();
  setButtons(g);
  renderKeyboard(g);
  renderIntervals(g);
}

function labelRound(g) {
  $("round").textContent = t("round", g.rounds);
  $("start-label").textContent = t(g.randomStart ? "startRandom" : g.start === MIDDLE_C ? "startMiddleC" : "startNote");
}

// The keys from the lowest to the highest note the round can have, widened to
// white keys at both ends.
function renderKeyboard(g) {
  let lo = Math.max(PIANO[0], g.start - (g.opts.up ? 0 : g.opts.range));
  let hi = Math.min(PIANO[1], g.start + g.opts.range);
  if (isBlack(lo)) lo--;
  if (isBlack(hi)) hi++;
  const whites = range(lo, hi).filter(n => !isBlack(n));
  const width = 100 / whites.length;
  const keyboard = $("keyboard");
  keyboard.replaceChildren();
  keyboard.style.setProperty("--whites", whites.length);
  for (const pitch of range(lo, hi)) {
    const key = document.createElement("button");
    key.type = "button";
    key.className = "key " + (isBlack(pitch) ? "black" : "white");
    key.dataset.pitch = pitch;
    key.setAttribute("aria-label", noteName(pitch) + (pitch === g.start ? t("startAria") : ""));
    if (pitch === g.start) key.classList.add("start");
    if (isBlack(pitch)) {
      const left = whites.filter(n => n < pitch).length * width;
      key.style.left = `calc(${left}% - ${width * 0.31}%)`;
      key.style.width = `${width * 0.62}%`;
    } else if (pitch % 12 === 0 || pitch === g.start) {
      key.append(noteName(pitch));
    }
    keyboard.append(key);
  }
  // When the keys don't all fit, start with the start note in the middle.
  const scroller = keyboard.parentElement, start = keyboard.querySelector(".start");
  scroller.scrollLeft = start.offsetLeft + start.offsetWidth / 2 - scroller.clientWidth / 2;
}

// A button for every interval in range, down and up.
function renderIntervals(g) {
  const box = $("intervals");
  box.replaceChildren();
  for (const sign of g.opts.up ? [1] : [-1, 1]) {
    const group = document.createElement("div");
    group.className = "group";
    group.dataset.sign = sign;
    const h = document.createElement("h3");
    const grid = document.createElement("div");
    grid.className = "interval-grid";
    for (let semis = 1; semis <= g.opts.range; semis++) {
      const {answer, short} = intervalParts(semis);
      const button = document.createElement("button");
      button.type = "button";
      button.dataset.answer = (sign > 0 ? "+" : "-") + answer;
      button.dataset.semis = sign * semis;
      const b = document.createElement("b");
      b.textContent = short;
      button.append(b, document.createElement("span"));
      grid.append(button);
    }
    group.append(h, grid);
    box.append(group);
  }
  labelIntervals(g);
}

// The words on the interval buttons, which change with the language.
function labelIntervals(g) {
  for (const group of $("intervals").children) {
    const direction = t(group.dataset.sign > 0 ? "Up" : "Down");
    group.querySelector("h3").textContent = t("from", direction, noteName(g.start));
    for (const button of group.querySelectorAll("button")) {
      button.querySelector("span").textContent = intervalParts(Number(button.dataset.semis)).words;
    }
  }
}

// Show the answer on the keyboard and among the intervals.
function markAnswer(g) {
  $("keyboard").querySelector(`[data-pitch="${g.target}"]`)?.classList.add("right");
  $("intervals").querySelector(`[data-semis="${g.target - g.start}"]`)?.classList.add("right");
}

// result is "first", "later" (more tries) or "shown".
function addHistory(g, result) {
  g.history.unshift({start: g.start, target: g.target, result, tries: g.tries});
  g.history.length = Math.min(g.history.length, 10);
  drawHistory(g);
  $("history-panel").hidden = false;
}

function drawHistory(g) {
  $("history").replaceChildren(...g.history.map(({start, target, result, tries}) => {
    const li = document.createElement("li");
    const what = document.createElement("span");
    what.className = "what";
    what.textContent = `${noteName(start)} → ${noteName(target)}`;
    const how = document.createElement("span");
    how.className = "how";
    how.textContent = intervalName(target - start);
    const badge = document.createElement("span");
    badge.className = `result ${result}`;
    badge.textContent = result === "first" ? t("scoreFirst") : result === "later" ? t("tries", tries) : t("scoreShown");
    li.append(what, badge, how);
    return li;
  }));
}

// Put the page in a language, and redraw what is already on it.
function setLanguage(name) {
  lang = name;
  try { localStorage.setItem("solfege.lang", name); } catch {}
  document.documentElement.lang = name;
  for (const el of document.querySelectorAll("[data-t]")) el.innerHTML = t(el.dataset.t);
  for (const b of document.querySelectorAll("[data-lang]")) b.setAttribute("aria-pressed", b.dataset.lang === name);
  $("answer").setAttribute("aria-label", t("answerLabel"));
  $("install-hide").setAttribute("aria-label", t("installHide"));
  $("start-button").textContent = t(game ? "startOver" : "start");
  $("notice").textContent = t("notice");
  $("options-error").textContent = optionsError ? t(optionsError) : "";
  if (!game) return;
  labelRound(game);
  labelIntervals(game);
  $("keyboard").querySelector(".start")?.setAttribute("aria-label", noteName(game.start) + t("startAria"));
  drawFeedback();
  drawHistory(game);
}

for (const b of document.querySelectorAll("[data-lang]")) {
  b.addEventListener("click", () => setLanguage(b.dataset.lang));
}

// --- tabs, keys and buttons --------------------------------------------------

// The score's tooltips say what each counter counts. They show on hover with a
// mouse, on focus from the keyboard, and on a tap; another tap, a tap
// elsewhere or Escape closes them.
let openTip = null;
function showTip(chip) {
  openTip = chip;
  for (const c of document.querySelectorAll(".chip")) $(c.getAttribute("aria-describedby")).hidden = c !== chip;
}
for (const chip of document.querySelectorAll(".chip")) {
  chip.addEventListener("pointerenter", e => { if (e.pointerType === "mouse") showTip(chip); });
  chip.addEventListener("pointerleave", e => { if (e.pointerType === "mouse" && openTip === chip) showTip(null); });
  chip.addEventListener("focus", () => { if (chip.matches(":focus-visible")) showTip(chip); });
  chip.addEventListener("blur", () => { if (openTip === chip) showTip(null); });
  chip.addEventListener("click", e => {
    e.stopPropagation();
    if (e.pointerType === "mouse") return;           // hovering already shows it
    showTip(openTip === chip ? null : chip);
  });
}
document.addEventListener("click", () => { if (openTip) showTip(null); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && openTip) showTip(null); });

function selectTab(name) {
  for (const tab of document.querySelectorAll("[role=tab]")) {
    tab.setAttribute("aria-selected", tab.dataset.tab === name);
  }
  for (const panel of document.querySelectorAll("[role=tabpanel]")) {
    panel.hidden = panel.dataset.panel !== name;
  }
  try { localStorage.setItem("solfege.tab", name); } catch {}
  if (name === "type" && game) $("answer").focus();
}

for (const tab of document.querySelectorAll("[role=tab]")) {
  tab.addEventListener("click", () => selectTab(tab.dataset.tab));
}
try {
  const saved = localStorage.getItem("solfege.tab");
  if (saved && document.querySelector(`[data-tab="${saved}"]`)) selectTab(saved);
} catch {}

$("keyboard").addEventListener("click", e => {
  const key = e.target.closest(".key");
  if (!key || !game) return;
  const pitch = Number(key.dataset.pitch);
  // An exact answer, such as "c#4". After the round a key only plays, and so
  // does one that can't be the answer, outside the start note's scale.
  if (game.phase === "asking" && inScale(game.opts, game.start, pitch)) {
    const right = game.answer(SHARPS[pitch % 12].toLowerCase() + (Math.floor(pitch / 12) - 1), key);
    if (right) return;
    // A wrong key is red only for a moment, so it doesn't look held down.
    clearTimeout(key.fade);
    key.fade = setTimeout(() => key.classList.remove("wrong"), 1000);
  }
  sound.play([[pitch, 0.0, 0.9]]);
});

$("intervals").addEventListener("click", e => {
  const button = e.target.closest("button[data-answer]");
  if (button && game) game.answer(button.dataset.answer, button);
});

$("type-form").addEventListener("submit", e => {
  e.preventDefault();
  const text = $("answer").value;
  if (!game) return;
  // The terminal's commands work here too.
  const command = {"": "playBoth", r: "playBoth", p: "playSecond", s: "giveUp", n: "next"}[normalize(text)];
  if (command) {
    game[command]();
    $("answer").value = "";
  } else if (game.answer(text)) {
    $("answer").value = "";
  } else {
    $("answer").select();
  }
});

$("play-both").addEventListener("click", () => game?.playBoth());
$("play-second").addEventListener("click", () => game?.playSecond());
$("give-up").addEventListener("click", () => game?.giveUp());
$("next").addEventListener("click", () => game?.next());

// Keyboard shortcuts, unless you are typing. Space plays even when a key or
// button has the focus; Enter then presses that button.
document.addEventListener("keydown", e => {
  if (!game || e.ctrlKey || e.metaKey || e.altKey) return;
  const target = e.target instanceof Element ? e.target : document.body;
  if (target.closest("input, select, textarea, summary")) return;
  const key = e.key.toLowerCase();
  if (key === "enter" && target.closest("button")) return;
  if (key === " " || key === "r") game.playBoth();
  else if (key === "p") game.playSecond();
  else if (key === "s") game.giveUp();
  else if (key === "n" || key === "enter") game.next();
  else return;
  e.preventDefault();
});

// --- settings ----------------------------------------------------------------

for (const [i, name] of INSTRUMENTS.entries()) {
  const label = name.replace("__", " + ").replaceAll("_", " ");
  $("opt-program").add(new Option(`${i} ${label}`, i));
}

const syncSound = () => { $("opt-program").disabled = $("opt-sound").value === "synth"; };
$("opt-sound").addEventListener("change", syncSound);

// The settings can come from the URL, named like the command-line options:
// ?start=g&range=7&up&chromatic&synth&program=40&seed=1
function readUrl() {
  const q = new URLSearchParams(location.search);
  if (q.has("start")) $("opt-start").value = q.get("start");
  if (q.has("range")) $("opt-range").value = q.get("range");
  if (q.has("program")) $("opt-program").value = q.get("program");
  if (q.has("seed")) $("opt-seed").value = q.get("seed");
  $("opt-up").checked = q.has("up");
  $("opt-chromatic").checked = q.has("chromatic");
  $("opt-sound").value = q.has("synth") ? "synth" : "piano";
  syncSound();
}

function writeUrl(opts) {
  const q = new URLSearchParams();
  if (normalize($("opt-start").value) !== "c4") q.set("start", $("opt-start").value.trim());
  if (opts.range !== 12) q.set("range", opts.range);
  if (opts.up) q.set("up", "");
  if (opts.chromatic) q.set("chromatic", "");
  if (opts.synth) q.set("synth", "");
  else if (opts.program !== 0) q.set("program", opts.program);
  if (opts.seed !== null) q.set("seed", opts.seed);
  const search = q.toString().replace(/=(?=&|$)/g, "");
  history.replaceState(null, "", search ? `?${search}` : location.pathname);
}

// An error's message is the key of its text in STRINGS.
function readOptions() {
  const start = parseStart($("opt-start").value);
  if (start === undefined) throw new Error("errStart");
  if (start !== null && (start < PIANO[0] || start > PIANO[1])) {
    throw new Error("errStartRange");
  }
  const rangeValue = Number($("opt-range").value);
  if (!Number.isInteger(rangeValue) || rangeValue < 1 || rangeValue > 24) {
    throw new Error("errRange");
  }
  const seedText = $("opt-seed").value.trim();
  if (seedText && !Number.isInteger(Number(seedText))) throw new Error("errSeed");
  return {
    start,
    range: rangeValue,
    up: $("opt-up").checked,
    chromatic: $("opt-chromatic").checked,
    synth: $("opt-sound").value === "synth",
    program: Number($("opt-program").value),
    seed: seedText ? Number(seedText) : null,
  };
}

function newGame() {
  let opts;
  try {
    opts = readOptions();
  } catch (e) {
    optionsError = e.message;
    $("options-error").textContent = t(optionsError);
    $("options-details").open = true;
    return;
  }
  optionsError = null;
  $("options-error").textContent = "";
  writeUrl(opts);
  game?.end();
  sound?.ctx.close();
  sound = new Sound(opts.synth, opts.program, () => { $("notice").hidden = false; });
  $("notice").hidden = true;
  $("history").replaceChildren();
  $("history-panel").hidden = true;
  $("welcome").hidden = true;
  $("playing").hidden = false;
  $("score").hidden = false;
  $("options-details").open = false;
  game = new Game(opts, sound);
  $("start-button").textContent = t("startOver");
  game.begin();
  $("play-both").focus();
}

$("options").addEventListener("submit", e => { e.preventDefault(); newGame(); });
$("welcome-start").addEventListener("click", newGame);

setLanguage(lang);
readUrl();

// --- installing it as an app ---------------------------------------------------

// Chrome, Edge and Samsung Internet say when the page can be installed (the
// beforeinstallprompt event); the button then opens their install dialog, so
// nobody has to find it in the menu. Safari on iPhone and iPad has no such
// event, so there the page says how to add it to the home screen. Neither shows
// once it runs as an app, or after × until the browser's data is cleared.
let installPrompt = null;
const runsAsApp = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIos = /iPhone|iPad|iPod/.test(navigator.userAgent)
  || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);   // iPads say they are Macs
const installHidden = () => { try { return localStorage.getItem("solfege.install-hidden") === "1"; } catch { return false; } };

function showInstall() {
  const button = !!installPrompt, ios = isIos && !runsAsApp() && !installPrompt;
  $("install-button").hidden = !button;
  $("install-ios").hidden = !ios;
  $("install").hidden = installHidden() || !(button || ios);
}

window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();          // the page's own button replaces the browser's bar
  installPrompt = e;
  showInstall();
});
window.addEventListener("appinstalled", () => { installPrompt = null; showInstall(); });
$("install-button").addEventListener("click", async () => {
  const prompt = installPrompt;
  if (!prompt) return;
  installPrompt = null;        // each event can prompt only once; the browser sends a new one if it may ask again
  prompt.prompt();
  await prompt.userChoice;
  showInstall();
});
$("install-hide").addEventListener("click", () => {
  try { localStorage.setItem("solfege.install-hidden", "1"); } catch {}
  showInstall();
});
showInstall();

// Keep the page and the samples for offline use, which also lets browsers
// install it as an app. This needs https or localhost, not a file.
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(e => console.warn(e));
}
</script>
</body>
</html>
